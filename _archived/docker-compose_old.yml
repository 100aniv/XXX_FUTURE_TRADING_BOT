version: '3.8'

# ============================================
# 통합 트레이딩 시스템 v2.0
# ============================================
# 서비스:
# - postgres: PostgreSQL 데이터베이스
# - main: 통합 시스템 (6개 전략 + ensemble + execution)
# ============================================

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16
    container_name: trading_system_postgres
    environment:
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_pw_2024
      POSTGRES_DB: trading_db
      TZ: Asia/Seoul
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5433:5432"  # 외부: 5433, 내부: 5432
    restart: unless-stopped
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Main Trading System (통합)
  # ============================================
  main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_system_main
    env_file:
      - .env
    environment:
      # Database
      - DATABASE_URL=postgresql://trading_user:trading_pw_2024@postgres:5432/trading_db
      
      # Strategy & Mode
      - STRATEGY_SELECTOR=${STRATEGY_SELECTOR:-ensemble}
      - TRADING_MODE=${TRADING_MODE:-paper}
      
      # Risk Management
      - EQUITY_USDT=${EQUITY_USDT:-10000}
      - RISK_PER_TRADE=${RISK_PER_TRADE:-0.01}
      - DAILY_LOSS_LIMIT_PCT=${DAILY_LOSS_LIMIT_PCT:-0.03}
      - MAX_CONCURRENT_POSITIONS=${MAX_CONCURRENT_POSITIONS:-5}
      - MAX_EXPOSURE_PER_SYMBOL_PCT=${MAX_EXPOSURE_PER_SYMBOL_PCT:-0.3}
      
      # Symbols
      - SYMBOLS=${SYMBOLS:-BTCUSDT,ETHUSDT}
      - TIMEFRAME=${TIMEFRAME:-5m}
      - LOOKBACK=${LOOKBACK:-400}
      
      # Binance API (LIVE mode only)
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_SECRET=${BINANCE_SECRET:-}
      
      # Telegram (optional)
      - ENABLE_TELEGRAM=${ENABLE_TELEGRAM:-false}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SYSTEM_NAME=${SYSTEM_NAME:-TRADING}
      
      # Strategy Parameters
      - RR=${RR:-1.8}
      - ATR_MULT_SL=${ATR_MULT_SL:-1.2}
      - MAX_LEVERAGE=${MAX_LEVERAGE:-10}
      - MIN_LEVERAGE=${MIN_LEVERAGE:-2}
      
      # TP/SL
      - ENABLE_TP_TRAIL=${ENABLE_TP_TRAIL:-true}
      - TP1_RR=${TP1_RR:-1.0}
      - TP2_RR=${TP2_RR:-2.0}
      - TRAIL_AFTER_TP1=${TRAIL_AFTER_TP1:-true}
      
      # Filters
      - COOLDOWN_CANDLES=${COOLDOWN_CANDLES:-3}
      - ENABLE_REGIME_ALERT=${ENABLE_REGIME_ALERT:-true}
      - ENABLE_VOL_SPIKE_FILTER=${ENABLE_VOL_SPIKE_FILTER:-true}
      - ENABLE_MTF_CONFIRM=${ENABLE_MTF_CONFIRM:-true}
      
      # Flash Guard
      - ENABLE_FLASH_GUARD=${ENABLE_FLASH_GUARD:-true}
      - FLASH_WINDOW_SEC=${FLASH_WINDOW_SEC:-60}
      - FLASH_PCT=${FLASH_PCT:-0.03}
      
      # Polling
      - POLL_INTERVAL_SEC=${POLL_INTERVAL_SEC:-5}
      
    command: python -u main.py
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - trading-network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'python.*main.py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  trading-network:
    driver: bridge

# ============================================
# 볼륨 (데이터 영속성)
# ============================================
volumes:
  pgdata:
    driver: local
