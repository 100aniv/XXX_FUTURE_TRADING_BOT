# ============================================================================
# 트레이딩 봇 설정 파일 (Trading Bot Configuration)
# ============================================================================
# 모든 설정을 이 파일에서 중앙 관리합니다.
# 환경변수는 fallback으로만 사용됩니다.

# ============================================================================
# 모드 설정 (Mode Configuration)
# ============================================================================
# backtest: 백테스트 (과거 데이터)
# paper: 페이퍼 트레이딩 (실시간, 모의)
# live: 라이브 트레이딩 (실전)
mode: backtest

# ============================================================================
# 심볼 설정 (Symbol Configuration)
# ============================================================================
symbols:
  mode: manual  # manual / top50 / top100 / all
  
  manual:  # 수동 선택 심볼 (9개로 확장)
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - XRPUSDT
    - ADAUSDT    # ⭐ 추가
    - DOGEUSDT   # ⭐ 추가
    - DOTUSDT    # ⭐ 추가
    - AVAXUSDT   # ⭐ 추가
  
  core:  # 핵심 심볼 (top50/top100/all 모드에서 항상 포함)
    - BTCUSDT
    - ETHUSDT
  
  max_streams: 120  # 최대 동시 스트림 수 (가드레일)
  
  topN:  # top50/top100 모드 설정
    n: 50
    min_volume_24h: 30000000
    refresh_interval: 3600

# ============================================================================
# 타임프레임 & 데이터 (Timeframe & Data)
# ============================================================================
timeframe: 5m  # 기본 타임프레임
lookback: 400  # 지표 계산용 캔들 수
htf: 1h  # Higher Timeframe (MTF 확인용)

# ============================================================================
# 자본 관리 (Capital Management)
# ============================================================================
capital:
  initial: 10000  # 초기 자본 ($)

# ============================================================================
# 리스크 관리 (Risk Management) - TUNING_VIBLE P0
# ============================================================================
risk:
  # P0: 필수 안정성
  risk_per_trade_pct: 0.5  # 계정 대비 (0.25~0.75%, 최대 1.0%) ⭐ TUNING_VIBLE
  per_trade: 0.005  # 거래당 리스크 (0.5%) - 레거시 호환
  
  # DDL (Daily Drawdown Limit)
  max_daily_loss_pct: 2.0  # -2%~-3% 도달 시 당일 종료 ⭐ TUNING_VIBLE
  daily_loss_limit: 0.98  # 레거시 (98%)
  
  # 연속 손실 스톱
  max_consecutive_losses: 4  # 3~4연속 SL 시 전략 쿨다운 ⭐ TUNING_VIBLE
  
  # 포지션 제한
  max_open_positions: 2  # 1~3개 (상관성 고려) ⭐ TUNING_VIBLE
  max_positions: 5  # 레거시 호환
  max_exposure_per_symbol: 0.6  # 심볼당 최대 노출 (60%)
  
  # 레버리지 & 청산가 여유
  leverage_cap: 5  # 레버리지 상한 ⭐ TUNING_VIBLE
  liq_buffer_multiple_of_SL: 4  # 청산가 여유 3~5×SL ⭐ TUNING_VIBLE

# ============================================================================
# 포트폴리오 관리 (Portfolio Management)
# ============================================================================
portfolio:
  max_total_exposure: 0.8  # 총 노출 한도 (80%)
  max_strategy_positions: 3  # 전략당 최대 포지션 수
  max_correlated_positions: 2  # 상관성 높은 포지션 최대 수

# ============================================================================
# 포지션 사이징 (Position Sizing)
# ============================================================================
position_sizing:
  max_position_value: 2500  # 포지션 최대 금액 ($)
  min_position_value: 10  # 포지션 최소 금액 ($)
  quality_weight_min: 0.7  # 품질 가중치 최소
  quality_weight_max: 1.3  # 품질 가중치 최대

# ============================================================================
# 레버리지 (Leverage) - TUNING_VIBLE P0
# ============================================================================
leverage:
  min: 2
  max: 5  # ⭐ TUNING_VIBLE cap 적용
  default: 5
  cap: 5  # TUNING_VIBLE 상한

# ============================================================================
# 수수료 & 회계 (Fees & Accounting) - TUNING_VIBLE P0
# ============================================================================
fees:
  maker: 0.0002  # 메이커 수수료 (0.02%)
  taker: 0.0004  # 테이커 수수료 (0.04%)
  slippage: 0.0005  # 슬리피지 (0.05%)

# ⭐ TUNING_VIBLE 회계 모델
accounting:
  fee_mode: "taker"  # taker 기준 수수료 가정
  fee_bps: 5  # 5 basis points (0.05%)
  funding_model: "avg_realized"  # 펀딩 반영 방식
  slippage_model: "atr_based"  # ATR 기반 슬리피지 모델

# ============================================================================
# 진입/청산 로직 (Entries & Exits) - TUNING_VIBLE P1
# ============================================================================

# ⭐ 진입 설정 (TUNING_VIBLE)
entries:
  type: "breakout_pullback"  # breakout | meanrev | ob_imbalance
  cooldown_candles: 3  # 중복 진입 쿨다운
  min_rr_required: 1.3  # 최소 RR 요구사항

# ⭐ 청산 설정 (TUNING_VIBLE)
exits:
  # SL (Stop Loss)
  stop:
    type: "atr"  # ATR 기반
    k: 1.8  # ATR 배수
  
  # ⭐ TP 분할 (TUNING_VIBLE 핵심!)
  take_profits:
    - r_multiple: 1.0   # TP1: +1R
      size_pct: 30      # 30% 종료
    - r_multiple: 2.0   # TP2: +2R
      size_pct: 40      # 40% 종료
    # 잔량 30%는 트레일링
  
  # 트레일링
  trailing:
    type: "atr"  # ATR 기반
    k: 2.5  # ATR 배수
    move_to_break_even_at_r: 0.8  # 0.8R 도달 시 BE 이동
  
  # 시간 기반 청산
  time_exit_min: 360  # 최대 보유시간(분)

# 레거시 TP/SL 설정
tp_sl:
  atr_mult_sl: 1.8  # SL ATR 배수 (TUNING_VIBLE exits.stop.k)
  atr_mult_tp: 3.0  # TP ATR 배수
  atr_mult_trail: 2.5  # Trailing ATR 배수 (TUNING_VIBLE)
  enable_trailing: true
  trail_after_tp1: true
  tp1_rr: 1.0  # TP1 (TUNING_VIBLE 30%)
  tp2_rr: 2.0  # TP2 (TUNING_VIBLE 40%)
  
  manual:
    sl_pct: 0.015
    tp_pct: 0.03

# ============================================================================
# 필터 (Filters) - TUNING_VIBLE P1
# ============================================================================

# ⭐ TUNING_VIBLE 필터 설정
filters:
  # HTF 추세 필터
  htf: "4h"  # 1h 또는 4h
  require_trend_align: true  # HTF 추세 정렬 요구
  
  # ATR 밴드
  atr_window: 14  # ATR 윈도우
  
  # 세션 필터
  session_whitelist:
    - "London"    # 런던 세션 (08:00-16:00 GMT)
    - "NY-open"   # 뉴욕 오픈 (13:00-17:00 GMT)
  
  # 이벤트 블랙아웃
  news_blackout_min: 20  # 이벤트 전후 N분 거래 금지
  
  # 레거시 필터
  regime_filter: true
  volume_spike: true
  mtf_confirm: true

enable_mtf_confirm: false  # 레거시
require_htf_aligned: true  # ⭐ HTF 정렬 요구
enable_vol_spike_filter: true
cooldown_candles: 5
vol_spike_mult: 2.5

# ============================================================================
# Flash Guard (급등락 감지 & 일시중지)
# ============================================================================
flash_guard:
  enabled: true
  window_sec: 60  # 감지 윈도우 (초)
  threshold_pct: 0.03  # 임계값 (3%)
  pause_candles: 3  # 일시중지 캔들 수

# ============================================================================
# 지표 설정 (Indicators)
# ============================================================================
indicators:
  ema:
    fast: 9
    mid: 21
    slow: 50
  
  rsi:
    length: 14
  
  macd:
    fast: 12
    slow: 26
    signal: 9
  
  bollinger:
    length: 20
    std: 2.0
  
  atr:
    length: 14
  
  volume:
    ma_length: 30

# ============================================================================
# 전략 모드 (Strategy Mode)
# ============================================================================
strategy:
  use_ensemble: true  # ⭐ 멀티 모드 활성화 (6개 전략 독립 실행)
  # selector: daytrade  # 앙상블 모드에서는 사용 안함

# ============================================================================
# 전략별 파라미터 (Strategy Parameters)
# ============================================================================
strategies:
  # --------------------------------------------------------------------------
  # Scalping (초단타)
  # --------------------------------------------------------------------------
  scalping:
    enabled: true
    timeframe: 5m
    rr: 2.5
    atr_mult_sl: 1.5
    risk_per_trade: 0.01
    cooldown_candles: 5  # 3 → 5 (중복 진입 방지)
    filters:
      regime: true  # ⭐ 활성화 (레짐 확인)
      volume_spike: false  # 거래량 급증 활용
      mtf_confirm: false  # 1m에 불필요
  
  # --------------------------------------------------------------------------
  # Daytrade (단타)
  # --------------------------------------------------------------------------
  daytrade:
    enabled: true
    timeframe: 15m
    rr: 3.0
    atr_mult_sl: 1.5
    risk_per_trade: 0.015
    cooldown_candles: 5  # 3 → 5
    filters:
      regime: true  # ⭐ 활성화
      volume_spike: true  # ⭐ 활성화 (안정적 진입)
      mtf_confirm: true  # ⭐ 활성화 (1h 확인)
  
  # --------------------------------------------------------------------------
  # Swing (스윙)
  # --------------------------------------------------------------------------
  swing:
    enabled: true
    timeframe: 1h
    rr: 2.2
    atr_mult_sl: 1.5
    risk_per_trade: 0.02
    cooldown_candles: 5
    filters:
      regime: true
      volume_spike: true
      mtf_confirm: true
  
  # --------------------------------------------------------------------------
  # Trend (추세)
  # --------------------------------------------------------------------------
  trend:
    enabled: true
    timeframe: 4h
    rr: 2.5
    atr_mult_sl: 1.5
    risk_per_trade: 0.025
    cooldown_candles: 5
    filters:
      regime: false
      volume_spike: false
      mtf_confirm: false
  
  # --------------------------------------------------------------------------
  # Reversion (평균회귀)
  # --------------------------------------------------------------------------
  reversion:
    enabled: true
    timeframe: 15m
    rr: 1.5  # 1.3 → 1.5 (RR 향상)
    atr_mult_sl: 1.2  # 1.0 → 1.2 (SL 여유)
    risk_per_trade: 0.018
    cooldown_candles: 5  # 3 → 5
    filters:
      regime: true  # ⭐ 활성화 (횡보장 확인)
      volume_spike: true
      mtf_confirm: false  # 반대 전략이라 OFF
  
  # --------------------------------------------------------------------------
  # Breakout (돌파)
  # --------------------------------------------------------------------------
  breakout:
    enabled: true
    timeframe: 1h
    rr: 2.0
    atr_mult_sl: 1.5
    risk_per_trade: 0.02
    cooldown_candles: 5
    filters:
      regime: false
      volume_spike: false
      mtf_confirm: false
  
  # --------------------------------------------------------------------------
  # Ensemble (앙상블 - 전략 조합)
  # --------------------------------------------------------------------------
  ensemble:
    rr: 2.0
    atr_mult_sl: 1.5
    risk_per_trade: 0.02
    cooldown_candles: 3
    
    filters:
      regime: true
      volume_spike: true
      mtf_confirm: false
    
    # 가중치 (승률 기준 조정)
    weights:
      reversion: 3.0  # ⭐ 승률 47.2% (가장 높음)
      daytrade: 2.5   # ⭐ 승률 27.8%
      scalping: 2.0   # 승률 31.7%
      swing: 2.2
      trend: 1.5      # 거래 6건만 (가중치 낮춤)
      breakout: 2.0
    
    # 앙상블 파라미터
    theta_long: 0.15  # LONG 임계값
    theta_short: 0.15  # SHORT 임계값
    alpha_winrate: 0.4  # 승률 가중치
    beta_rr: 0.2  # RR 가중치
    gamma_sharpe: 0.2  # Sharpe 가중치
    delta_confidence: 0.15  # 신뢰도 가중치
    epsilon_regime: 0.05  # 레짐 가중치
    consensus_bonus: 0.2  # 합의 보너스
    rr_bonus: 0.2  # RR 보너스
    rr_bonus_threshold: 1.6  # RR 보너스 임계값
    window_sec: 10  # 신호 윈도우 (초)
    performance_window_days: 30  # 성과 윈도우 (일)

# ============================================================================
# 백테스트 설정 (Backtest Configuration)
# ============================================================================
backtest:
  data_dir: data  # CSV 데이터 디렉토리
  period: three_months  # 사용할 기간
  
  # symbol: BTCUSDT  # 단일 심볼 모드 (주석 처리 시 멀티 심볼)
  
  periods:  # 기간 정의
    three_months:
      start_date: '2025-07-24'
      end_date: '2025-10-22'
    
    one_year:
      start_date: '2024-01-01'
      end_date: '2024-12-31'
    
    three_years:
      start_date: '2022-01-01'
      end_date: '2024-12-31'
    
    ten_years:
      start_date: '2015-01-01'
      end_date: '2025-10-19'
  
  custom:  # 사용자 정의 기간
    start_date: '2024-01-01'
    end_date: '2024-12-31'

# ============================================================================
# 알림 (Notifications)
# ============================================================================
notifications:
  telegram:
    enabled: true
    system_name: TRADING

# ============================================================================
# 실행 (Execution) - TUNING_VIBLE P2
# ============================================================================
execution:
  order_type: "limit_post_only"  # post-only(limit), IOC, market
  max_slippage_bp: 8  # 슬리피지 캔 (basis points)
  retry:
    max_attempts: 3  # 재시도 최대 횟수
    backoff_ms: 200  # 재시도 간격 (ms)

# ============================================================================
# 상관성 & 익스포저 (Exposure) - TUNING_VIBLE P2
# ============================================================================
exposure:
  correlation_group_cap_pct: 1.0  # 그룹당 위험%
  symbol_groups:
    - name: "BTC-ETH"
      symbols:
        - BTCUSDT
        - ETHUSDT
    - name: "ALTS"
      symbols:
        - SOLUSDT
        - BNBUSDT
        - XRPUSDT

# ============================================================================
# 성능 & 로깅 (Performance & Logging)
# ============================================================================
performance:
  poll_interval_sec: 5
  enable_profiling: false
  log_level: INFO
