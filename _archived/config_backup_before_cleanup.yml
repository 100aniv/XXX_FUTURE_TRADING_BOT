backtest:
  custom:
    end_date: '2024-12-31'
    start_date: '2024-01-01'
  data_dir: data
  period: three_months
  periods:
    one_year:
      end_date: '2024-12-31'
      start_date: '2024-01-01'
    three_months:
      end_date: '2025-10-22'
      start_date: '2025-07-24'
    three_years:
      end_date: '2024-12-31'
      start_date: '2022-01-01'
    ten_years:
      end_date: '2025-10-19'
      start_date: '2015-01-01'
  # symbol 제거 → 멀티 심볼 모드
capital:
  initial: 10000
cooldown_candles: 3
enable_mtf_confirm: false
enable_vol_spike_filter: false
fees:
  maker: 0.0002
  slippage: 0.0005
  taker: 0.0004
filters:
  mtf_confirm: true
  regime_filter: true
  volume_spike: true
flash_guard:
  enabled: true
  pause_candles: 3
  threshold_pct: 0.03
  window_sec: 60
htf: 1h
indicators:
  atr:
    length: 14
  bollinger:
    length: 20
    std: 2.0
  ema:
    fast: 9
    mid: 21
    slow: 50
  macd:
    fast: 12
    signal: 9
    slow: 26
  rsi:
    length: 14
  volume:
    ma_length: 30
leverage:
  default: 5
  max: 10
  min: 2
lookback: 400
mode: backtest
notifications:
  telegram:
    enabled: true
    system_name: TRADING
performance:
  enable_profiling: false
  log_level: INFO
  poll_interval_sec: 5
portfolio:
  max_correlated_positions: 2
  max_strategy_positions: 3
  max_total_exposure: 0.8
position_sizing:
  max_position_value: 2500  # $5000 → $2500 (거래 빈도 증가)
  min_position_value: 10
  quality_weight_max: 1.3
  quality_weight_min: 0.7
require_htf_aligned: false
risk:
  daily_loss_limit: 0.99
  max_exposure_per_symbol: 0.6
  max_positions: 5
  per_trade: 0.01
strategies:
  breakout:
    atr_mult_sl: 1.5
    cooldown_candles: 5
    enabled: true
    filters:
      mtf_confirm: false
      regime: false
      volume_spike: false
    risk_per_trade: 0.02
    rr: 2.0
    timeframe: 1h
  daytrade:
    atr_mult_sl: 1.5
    cooldown_candles: 3
    enabled: true
    filters:
      mtf_confirm: false
      regime: false
      volume_spike: false
    risk_per_trade: 0.015
    rr: 3.0
    timeframe: 15m
  ensemble:
    alpha_winrate: 0.4
    atr_mult_sl: 1.5
    beta_rr: 0.2
    consensus_bonus: 0.2
    cooldown_candles: 3
    delta_confidence: 0.15
    epsilon_regime: 0.05
    filters:
      mtf_confirm: false
      regime: true
      volume_spike: true
    gamma_sharpe: 0.2
    performance_window_days: 30
    risk_per_trade: 0.02
    rr: 2.0
    rr_bonus: 0.2
    rr_bonus_threshold: 1.6
    theta_long: 0.15
    theta_short: 0.15
    weights:
      breakout: 2.2
      daytrade: 2.3
      reversion: 2.0
      scalping: 1.8
      swing: 2.1
      trend: 2.5
    window_sec: 10
  reversion:
    atr_mult_sl: 1.0
    cooldown_candles: 3
    enabled: true
    filters:
      mtf_confirm: false
      regime: false
      volume_spike: true
    risk_per_trade: 0.018
    rr: 1.3
    timeframe: 15m
  scalping:
    atr_mult_sl: 1.5
    cooldown_candles: 3
    enabled: true
    filters:
      mtf_confirm: false
      regime: false
      volume_spike: false
    risk_per_trade: 0.01
    rr: 2.5
    timeframe: 5m
  swing:
    atr_mult_sl: 1.5
    cooldown_candles: 5
    enabled: true
    filters:
      mtf_confirm: true
      regime: true
      volume_spike: true
    risk_per_trade: 0.02
    rr: 2.2
    timeframe: 1h
  trend:
    atr_mult_sl: 1.5
    cooldown_candles: 5
    enabled: true
    filters:
      mtf_confirm: false
      regime: false
      volume_spike: false
    risk_per_trade: 0.025
    rr: 2.5
    timeframe: 4h
strategy:
  selector: daytrade
  use_ensemble: false
symbols:
  core:
  - BTCUSDT
  - ETHUSDT
  manual:
  - BTCUSDT
  - ETHUSDT
  - BNBUSDT
  - SOLUSDT
  - XRPUSDT
  max_streams: 120
  mode: manual
  topN:
    min_volume_24h: 30000000
    n: 50
    refresh_interval: 3600
timeframe: 5m
tp_sl:
  atr_mult_sl: 1.5
  atr_mult_tp: 3.0
  atr_mult_trail: 1.2
  enable_trailing: true
  manual:
    sl_pct: 0.015
    tp_pct: 0.03
  tp1_rr: 1.0
  tp2_rr: 2.0
  trail_after_tp1: true
vol_spike_mult: 3.0
