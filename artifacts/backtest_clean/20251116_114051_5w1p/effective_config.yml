system:
  timezone: Asia/Seoul
  candle_queue_size: 600000
trial_id: null
database:
  url: ${DATABASE_URL}
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
telegram:
  token: ${TELEGRAM_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  enabled: ${ENABLE_TELEGRAM}
  emoji:
    long_circle: 🔵
    long_arrow: 📈
    short_circle: 🔴
    short_arrow: 📉
    take_profit: ✅🏆
    stop_loss: ⛔🛑
    tp1_partial: 🟡🎯
    default: ⚪
  terms:
    exposure: 투입금액
    margin: 증거금
    slippage: 슬리피지
    fee: 수수료
accounting:
  fee_bps: 5
  fee_mode: taker
  funding_model: avg_realized
  slippage_model: atr_based
backtest:
  custom:
    end_date: '2024-09-30'
    start_date: '2024-01-01'
  data_dir: data
  data_file: data/BTCUSDT_3m_2024-10-01_2024-12-31_OOS.csv
  period: custom
  periods:
    one_year:
      end_date: '2024-12-31'
      start_date: '2024-01-01'
    ten_years:
      end_date: '2025-10-19'
      start_date: '2015-01-01'
    three_months:
      end_date: '2025-10-22'
      start_date: '2025-07-24'
    three_years:
      end_date: '2024-12-31'
      start_date: '2022-01-01'
  symbol: BTCUSDT
  persist_signals: false
  start_date: '2024-11-01'
  end_date: '2024-11-07'
flow_guardian:
  enabled: true
  selftest:
    max_runtime_sec: 120
    require_metrics:
    - profit_factor
    - winrate
    - score_total
    - exp_score
    min_profit_factor: 0.0
    min_winrate: 0.0
    consistency_checks:
      db_vs_json_score_equal: true
      signals_no_nan: true
      risk_never_oversize: true
    snapshot_rules:
      require_segment_isolation: true
    artifacts:
      require_files:
      - logs/trial_0000.json
      - logs/application.log
  essential_strategies:
  - scalping
  - daytrade
  startup_bars:
    3m: 1000
    5m: 1000
    15m: 1000
    1h: 300
    4h: 200
  warmup_policy: indicator_max
  on_not_ready: backfill_then_wait
  functional:
    scenarios:
    - name: pnl_calculation_simple
      feed: data/golden/BTCUSDT_15m_golden_300.csv
      slice:
        start: 0
        len: 50
      config:
        sl: 0.01
        tp: 0.02
        fee: 0.0004
      expect:
        winrate_min: 0.0
        pf_min: 0.0
    - name: risk_consecutive_losses
      feed: data/golden/BTCUSDT_15m_golden_300.csv
      slice:
        start: 50
        len: 30
      config:
        max_consecutive_losses: 7
      expect:
        trades_max: 10
    - name: portfolio_exposure_limit
      feed: data/golden/BTCUSDT_15m_golden_300.csv
      slice:
        start: 100
        len: 40
      config:
        max_exposure_pct: 0.95
      expect:
        blocked_if_over_exposure: true
capital:
  initial: 50000
equity: 50000
cooldown_candles: 5
enable_mtf_confirm: true
htf: 1h
enable_vol_spike_filter: true
entries:
  cooldown_candles: 1
  min_rr_required: 1.2
  type: meanrev
execution:
  max_slippage_bp: 12
  order_type: limit_post_only
  reject_cooldown_seconds: 60
  retry:
    backoff_ms: 200
    max_attempts: 3
  fill_policy: next_open
  fees_bps: 10
  slippage:
    type: fixed
    bps: 5
  cooldown_minutes: 0
exits:
  stop:
    k: 1.8
    type: atr
  take_profits:
  - r_multiple: 1.5
    size_pct: 30
  - r_multiple: 3.0
    size_pct: 40
  time_exit_min: 360
  trailing:
    k: 3.0
    move_to_break_even_at_r: 0.7
    type: atr
  volatility_regime_multipliers:
    high_vol: 1.2
    neutral: 1.0
    low_vol: 0.9
  use_ohlc_check: true
  sl_priority: BEFORE_TP
  price_levels:
    advanced:
      enabled: true
  binance_api:
    working_type: CONTRACT_PRICE
    price_protect: true
exposure:
  correlation_group_cap_pct: 1.0
  symbol_groups:
  - name: BTC-ETH
    symbols:
    - BTCUSDT
    - ETHUSDT
  - name: ALTS
    symbols:
    - SOLUSDT
    - BNBUSDT
    - XRPUSDT
fees:
