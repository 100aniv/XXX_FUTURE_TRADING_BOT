version: '3.8'

# ============================================
# Trading Bot System v3.0 (3-Mode)
# ============================================
# 3가지 독립 컨테이너:
#   1. trading_bot_sim (백테스트)
#   2. trading_bot_paper (페이퍼 트레이딩)
#   3. trading_bot_live (실거래)
# ============================================

name: xxx_trading_bot

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db_postgres:
    image: postgres:16
    container_name: trading_db_postgres
    environment:
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_pw_2024
      POSTGRES_DB: trading_db
      TZ: Asia/Seoul
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - xxx_trading_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Tuning Scheduler (adaptive schedules per strategy)
  # ============================================
  tuning_scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuning_scheduler
    profiles:
      - tuning
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://trading_user:trading_pw_2024@db_postgres:5432/trading_db
      - OPTUNA_STORAGE=${OPTUNA_STORAGE:-postgresql://trading_user:trading_pw_2024@db_postgres:5432/trading_db}
      - TUNE_WINDOW_DAYS=${TUNE_WINDOW_DAYS:-7}
      - ENABLE_TELEGRAM=${ENABLE_TELEGRAM:-true}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SYSTEM_NAME=TUNING_SCHED
      - PYTHONUNBUFFERED=1
    command: python -u common/tuning_scheduler.py
    volumes:
      - ./config.yml:/app/config.yml
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./db:/app/db
    depends_on:
      db_postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - xxx_trading_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis (parameter broadcast/cache)
  # ============================================
  redis:
    image: redis:7
    container_name: trading_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./redisdata:/data
    restart: unless-stopped
    networks:
      - xxx_trading_network

  # ============================================
  # Trading Bot - BACKTEST Mode
  # ============================================
  trading_bot_backtest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_bot_backtest
    profiles:
      - backtest
    restart: "no"  # ← 백테스트는 재시작 안 함 (한 번만 실행)
    env_file:
      - .env
    environment:
      # Database (db_postgres 서비스)
      - DATABASE_URL=postgresql://trading_user:trading_pw_2024@db_postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      
      # Strategy & Mode
      - STRATEGY_SELECTOR=${STRATEGY_SELECTOR:-ensemble}
      - TRADING_MODE=backtest
      
      # Risk Management
      - EQUITY_USDT=${EQUITY_USDT:-10000}
      - RISK_PER_TRADE=${RISK_PER_TRADE:-0.01}
      - DAILY_LOSS_LIMIT_PCT=${DAILY_LOSS_LIMIT_PCT:-0.03}
      - MAX_CONCURRENT_POSITIONS=${MAX_CONCURRENT_POSITIONS:-5}
      - MAX_EXPOSURE_PER_SYMBOL_PCT=${MAX_EXPOSURE_PER_SYMBOL_PCT:-0.3}
      
      # Symbols
      - SYMBOLS=${SYMBOLS:-BTCUSDT,ETHUSDT}
      - TIMEFRAME=${TIMEFRAME:-5m}
      - LOOKBACK=${LOOKBACK:-400}
      
      # Binance API (LIVE mode only)
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_SECRET=${BINANCE_SECRET:-}
      
      # Telegram (optional)
      - ENABLE_TELEGRAM=${ENABLE_TELEGRAM:-false}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SYSTEM_NAME=${SYSTEM_NAME:-TRADING}
      
      # Strategy Parameters
      - RR=${RR:-1.8}
      - ATR_MULT_SL=${ATR_MULT_SL:-1.2}
      - MAX_LEVERAGE=${MAX_LEVERAGE:-10}
      - MIN_LEVERAGE=${MIN_LEVERAGE:-2}
      
      # TP/SL
      - ENABLE_TP_TRAIL=${ENABLE_TP_TRAIL:-true}
      - TP1_RR=${TP1_RR:-1.0}
      - TP2_RR=${TP2_RR:-2.0}
      - TRAIL_AFTER_TP1=${TRAIL_AFTER_TP1:-true}
      
      # Filters
      - COOLDOWN_CANDLES=${COOLDOWN_CANDLES:-3}
      - ENABLE_REGIME_ALERT=${ENABLE_REGIME_ALERT:-true}
      - ENABLE_VOL_SPIKE_FILTER=${ENABLE_VOL_SPIKE_FILTER:-true}
      - ENABLE_MTF_CONFIRM=${ENABLE_MTF_CONFIRM:-true}
      
      # Flash Guard
      - ENABLE_FLASH_GUARD=${ENABLE_FLASH_GUARD:-true}
      - FLASH_WINDOW_SEC=${FLASH_WINDOW_SEC:-60}
      - FLASH_PCT=${FLASH_PCT:-0.03}
      
      # Polling
      - POLL_INTERVAL_SEC=${POLL_INTERVAL_SEC:-5}
      
    command: python -u main.py
    volumes:
      - ./config.yml:/app/config.yml  # ⭐ 설정 파일 마운트
      - ./logs:/app/logs
    depends_on:
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - xxx_trading_network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'python.*main.py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Trading Bot - PAPER Mode (Ensemble)
  # ============================================
  # PR7-2: 앙상블 Paper 모드 (1컨테이너로 6전략 동시 실행)
  # ============================================
  trading_bot_paper_ensemble:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_bot_paper_ensemble
    profiles:
      - paper  # 기본 Paper 프로파일
      - paper-ensemble  # 앙상블 전용 프로파일
    env_file:
      - .env
    environment:
      # Timezone (한국 시간)
      - TZ=Asia/Seoul
      
      # Database
      - DATABASE_URL=postgresql://trading_user:trading_pw_2024@db_postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      
      # Strategy & Mode
      - TRADING_MODE=paper
      # ⭐ 환경변수로 앙상블 모드 강제 (config.yml 오버라이드)
      - USE_ENSEMBLE=true
      - STRATEGY_SELECTOR=null
      
      # Risk Management
      - EQUITY_USDT=50000
      - RISK_PER_TRADE=0.01
      - DAILY_LOSS_LIMIT_PCT=0.03
      - MAX_CONCURRENT_POSITIONS=5
      - MAX_EXPOSURE_PER_SYMBOL_PCT=0.3
      - LOOKBACK=100
      
      # Telegram
      - ENABLE_TELEGRAM=${ENABLE_TELEGRAM:-true}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SYSTEM_NAME=ENSEMBLE_PAPER
      
      # Encoding
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
      - PYTHONUNBUFFERED=1
      
    command: python -u main.py
    depends_on:
      db_postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./config.yml:/app/config.yml  # ⭐ use_ensemble=true, selector=null 설정
      - ./logs:/app/logs
    networks:
      - xxx_trading_network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'python.*main.py' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # 개별 전략 Paper 모드 (격리 디버깅용)
