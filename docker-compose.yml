      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ENABLE_TELEGRAM=${ENABLE_TELEGRAM:-true}
      - SYSTEM_NAME=SCALPING_TUNER
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    command: >
      python -u scripts/tuning/tune_scalping.py
      --study scalping_v5_htf
      --trials 200
      --use-wfa 1
      --notify-progress 1
      --notify-completion 1
      --early-stop-grade OFF
      --dod-mode robust
      --min-trades-oos 30
      --penalty-variance 0.5
      --penalty-regime-min B
      --apply-best 1
