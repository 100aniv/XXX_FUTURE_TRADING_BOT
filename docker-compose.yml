        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./config.yml:/app/config.yml  # ⭐ config.yml 마운트 (manual 20개 심볼)
      - ./configs:/app/configs        # ⭐ active.yml 적용을 위한 configs 마운트
      - ./logs:/app/logs
