  # ============================================
  tuner_scalping:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuner_scalping
    profiles:
      - backtest_tuning
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://trading_user:trading_pw_2024@db_postgres:5432/trading_db
