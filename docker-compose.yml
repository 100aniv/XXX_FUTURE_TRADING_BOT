      - MAX_CONCURRENT_POSITIONS=${MAX_CONCURRENT_POSITIONS:-5}
      - MAX_EXPOSURE_PER_SYMBOL_PCT=${MAX_EXPOSURE_PER_SYMBOL_PCT:-0.3}
      
      # Symbols: config.yml의 symbols.mode가 우선 적용됨 (manual 20개)
      # - SYMBOLS=${SYMBOLS:-BTCUSDT,ETHUSDT}  # ❌ 제거 (config.yml 사용)
      - LOOKBACK=${LOOKBACK:-100}
      
      # Telegram
      - ENABLE_TELEGRAM=${ENABLE_TELEGRAM:-true}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      
      # Encoding
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
      - PYTHONUNBUFFERED=1
      
    command: python -u main.py
    depends_on:
