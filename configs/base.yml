# ========================================
# 템포럴 디커플링
# ========================================
metrics:
  jitter_threshold: 60    # 지터 임계값 (60초)
  health:
    max_api_latency_ms: 500
    max_ws_message_lag_sec: 30

# ========================================
# PR12: 거래소 스펙
# ========================================
exchange:
  specs:
    dynamic_rounding: true      # 동적 반올림 활성화 (tick_size/step_size)
    cache_ttl_sec: 3600         # 캐시 TTL (1시간)
  
  funding:
    enabled: true               # 펀딩 연동 활성화
    cache_ttl_sec: 300          # 펀딩 캐시 TTL (5분)

# ========================================
# 애널리틱스 (Analytics)
# ========================================
analytics:
  reports:
