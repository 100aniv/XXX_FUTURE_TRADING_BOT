# ========================================
# PHASE28-2: btc5m_baseline_v1 Tuning Parameter Space
# ========================================
# 대상 전략: btc5m_baseline_v1 (BTCUSDT, 5m, ADX Regime 기반)
# 튜닝 방법: Random Search → Bayesian Search
# 목적: PHASE28-1 Baseline 성능 개선을 위한 최적 파라미터 세트 도출
# ========================================

# ========================================
# Run 메타데이터
# ========================================
run_metadata:
  phase: "PHASE28-2"
  run_name: "btc5m_baseline_tuning_round1"
  strategy_family: "baseline"
  strategy_name: "btc5m_baseline_v1"
  description: "First tuning round for btc5m_baseline_v1 strategy"
  
  # 튜닝 설정
  tuning_method: "random"  # random | bayesian | grid
  target_metric: "sharpe_like_ratio"  # 최적화 목표
  
  # Random Search 설정
  random_search:
    n_trials: 25  # 초기 탐색용 (소규모)
    seed: 42
  
  # Bayesian Search 설정 (PHASE28-3에서 사용)
  bayesian_search:
    n_trials: 5  # dry-run용 (매우 작게)
    n_startup_trials: 10
    seed: 42

# ========================================
# 전략 & 심볼
# ========================================
target:
  symbol: BTCUSDT
  timeframe: 5m
  mode: backtest

# ========================================
# Base Config (공통 설정)
# ========================================
base_config:
  # 베이스 config 경로 (PHASE28-1 config 재사용)
  path: "configs/backtest/phase28_1_btc5m_baseline_presets.yml"
  
  # Override 없이 사용할 공통 설정
  # (capital, portfolio, risk, exits, flow_guardian 등은 base config 그대로)

# ========================================
# 시장 구간 (Market Periods)
# ========================================
# PHASE28-1에서 정의한 3개 구간 사용
market_periods:
  bull:
    name: "Bull Trend"
    description: "상승 추세 구간"
    start: "2024-11-01"
    end: "2024-11-30"
    weight: 1.0  # 성능 평가 시 가중치
  
  range:
    name: "Range Consolidation"
    description: "횡보 구간"
    start: "2024-10-01"
    end: "2024-10-31"
    weight: 1.0
  
  neutral:
    name: "Neutral Period"
    description: "중립 시장 구간"
    start: "2024-11-30"
    end: "2024-12-30"
    weight: 1.5  # 최근 구간이므로 가중치 높임

# ========================================
# 파라미터 탐색 공간 (Parameter Space)
# ========================================
# ParamSpace 클래스 규격에 맞춤:
#   type: 'int' | 'float' | 'categorical'
#   int/float: min, max, (log: optional)
#   categorical: values (리스트)
# ========================================
param_space:
  # RSI 진입 조건
  rsi_long_threshold:
    type: int
    min: 40
    max: 48
    description: "LONG 진입 RSI threshold (낮을수록 공격적)"
    baseline: 45
  
  rsi_short_threshold:
    type: int
    min: 52
    max: 58
    description: "SHORT 진입 RSI threshold (높을수록 공격적)"
    baseline: 55
  
  # Bollinger Bands 진입 조건
  bb_std_main:
    type: float
    min: 0.9
    max: 1.2
    description: "BB Main 진입 밴드 (std 배수)"
    baseline: 1.0
  
  bb_std_strong:
    type: float
    min: 1.3
    max: 1.6
    description: "BB Strong 진입 밴드 (std 배수, 극단적 진입)"
    baseline: 1.5
  
  # ADX Regime 분류
  adx_trend_threshold:
    type: int
    min: 18
    max: 28
    description: "ADX Trend vs Range 분류 threshold"
    baseline: 25
  
  # Momentum 조건
  momentum_lookback:
    type: categorical
    values: [3, 5, 7, 10]
    description: "Momentum 계산 lookback 캔들 수"
    baseline: 5
  
  momentum_threshold:
    type: float
    min: 0.0005
    max: 0.002
    description: "Momentum 변화율 threshold (0.05%~0.2%)"
    baseline: 0.001
  
  # Risk Management
  atr_mult_sl:
    type: float
    min: 1.0
    max: 2.0
    description: "Stop Loss 배수 (ATR 기준)"
    baseline: 1.5
  
  rr:
    type: float
    min: 1.2
    max: 2.0
    description: "Risk-Reward ratio"
    baseline: 1.5
  
  # Time Exit
  max_hold_minutes:
    type: categorical
    values: [45, 60, 90, 120]
    description: "최대 보유 시간 (분)"
    baseline: 60

# ========================================
# 메트릭 평가 기준
# ========================================
metrics:
  # Primary 메트릭 (최적화 목표)
  primary:
    name: "sharpe_like_ratio"
    description: "Sharpe-like ratio (일별 수익률 기반)"
    direction: "maximize"
  
  # Secondary 메트릭 (필터링/평가)
  secondary:
    - name: "total_trades"
      description: "총 거래 수"
      min_threshold: 10  # 최소 거래 수 (너무 적으면 제외)
    
    - name: "win_rate"
      description: "승률 (%)"
      direction: "maximize"
    
    - name: "max_drawdown"
      description: "최대 낙폭 (%)"
      max_threshold: 20  # 20% 초과 MDD는 제외
    
    - name: "net_pnl"
      description: "순수익 (USDT)"
      direction: "maximize"

# ========================================
# Job 실행 설정
# ========================================
execution:
  # 각 Job의 백테스트 실행 설정
  timeout_seconds: 180  # Job 타임아웃 (3분)
  max_retries: 2  # 실패 시 재시도 횟수
  
  # 병렬 실행 (Optional, PHASE28-2에서는 순차 실행)
  parallel:
    enabled: false
    max_workers: 1

# ========================================
# 결과 저장
# ========================================
output:
  # 결과 저장 경로
  results_dir: "reports/tuning/phase28_2"
  
  # 상위 N개 파라미터 세트 저장
  top_n: 10
  
  # Markdown 리포트
  report:
    enabled: true
    path: "docs/PHASE28/PHASE28-2_TUNING_ROUND1_REPORT.md"
  
  # JSON 결과
  json:
    enabled: true
    path: "reports/tuning/phase28_2/phase28_2_tuning_results.json"

# ========================================
# Acceptance Criteria (PHASE28-2 완료 조건)
# ========================================
acceptance:
  # A1. Random Search 실행
  random_trials_min: 20  # 최소 20개 Trial 실행
  
  # A2. Bayesian Search dry-run
  bayesian_trials_min: 3  # 최소 3개 Trial 실행
  
  # A3. 유효한 결과 비율
  valid_results_ratio: 0.7  # 70% 이상 Trial이 유효한 결과 (total_trades ≥ 10)
  
  # A4. 테스트
  unit_tests_pass: true
  regression_tests_pass: true
  
  # A5. 문서
  design_doc: "docs/PHASE28/PHASE28-2_TUNING_ROUND1_DESIGN.md"
  report_doc: "docs/PHASE28/PHASE28-2_TUNING_ROUND1_REPORT.md"
