# ========================================
# PHASE28-4: Bayesian Search Round 1 Config
# ========================================
# 대상 전략: btc5m_baseline_v1
# 튜닝 방법: Bayesian Optimization (Optuna TPE)
# 목적: PHASE28-3 Random Search 결과 기반 효율적 파라미터 탐색
# ========================================

# ========================================
# Run 메타데이터
# ========================================
run_metadata:
  phase: "PHASE28-4"
  run_name: "btc5m_bayesian_round1"
  strategy_family: "baseline"
  strategy_name: "btc5m_baseline_v1"
  description: "Bayesian Search Round 1 - Top-N seed from Random Search"
  
  # 튜닝 설정
  tuning_method: "bayesian"
  target_metric: "sharpe_like_ratio"

# ========================================
# Bayesian Search 설정
# ========================================
bayesian_search:
  # Trial 수
  max_trials_per_period: 25  # 각 Period당 25 trials (총 50 trials)
  
  # Optuna 설정
  n_startup_trials: 5  # Random 탐색 초기화 trial 수
  sampler: "TPE"  # Tree-structured Parzen Estimator
  
  # Random seed (PHASE28-3과 구분)
  random_seed: 84
  
  # 목적 함수 설정
  objective:
    metric: "sharpe_like_ratio"
    direction: "maximize"
    
    # Soft constraints (패널티)
    min_trades_for_valid_trial: 10
    max_allowed_drawdown: -15.0  # % 단위 (예: -15% 이하면 패널티)
    
    # 패널티 가중치
    trade_penalty_weight: 2.0  # 거래 수 부족 시 패널티 배수
    drawdown_penalty_weight: 50.0  # MaxDD 초과 시 패널티 배수

# ========================================
# Top-N Seed 설정
# ========================================
top_n_seed:
  # Random Search 결과 경로
  random_search_results_path: "reports/tuning/phase28_3/results.json"
  
  # Top-N 후보 수
  top_n: 5
  
  # 필터 기준
  min_trades: 5
  max_drawdown_threshold: -20.0  # % 단위

# ========================================
# 전략 & 심볼
# ========================================
target:
  symbol: BTCUSDT
  timeframe: 5m
  mode: backtest

# ========================================
# Base Config
# ========================================
base_config:
  path: "configs/backtest/phase28_2_btc5m_tuning_base.yml"

# ========================================
# 시장 구간 (Market Periods)
# ========================================
# PHASE28-3과 동일 (재현성 및 비교 가능성)
market_periods:
  bull:
    name: "Bull Trend"
    description: "상승 추세 구간"
    start: "2024-11-01"
    end: "2024-11-30"
    weight: 1.0
  
  range:
    name: "Range Consolidation"
    description: "횡보 구간"
    start: "2024-10-01"
    end: "2024-10-31"
    weight: 1.0

# ========================================
# 파라미터 탐색 공간
# ========================================
# PHASE28-3과 동일 ParamSpace 사용
param_space_path: "configs/tuning/phase28_2_btc5m_baseline_paramspace.yml"

# ========================================
# Job 실행 설정
# ========================================
execution:
  timeout_seconds: 180
  max_retries: 2
  
  parallel:
    enabled: false
    max_workers: 1

# ========================================
# 결과 저장
# ========================================
output:
  results_dir: "reports/tuning/phase28_4"
  
  top_n: 10
  
  report:
    enabled: true
    path: "docs/PHASE28/PHASE28-4_RESULTS.md"
  
  json:
    enabled: true
    path: "reports/tuning/phase28_4/results.json"

# ========================================
# Acceptance Criteria
# ========================================
acceptance:
  # 실행
  bayesian_trials_min_per_period: 20  # 각 Period당 최소 20 trials
  
  # 유효 결과
  valid_results_per_period: 3  # 각 Period에서 필터 통과 trial ≥ 3개
  
  # 품질
  positive_sharpe_candidates: 1  # 양의 Sharpe Ratio 후보 ≥ 1개
  
  # 테스트
  unit_tests_pass: true
  regression_tests_pass: true
  
  # 문서
  design_doc: "docs/PHASE28/PHASE28-4_BAYESIAN_SEARCH_ROUND1_DESIGN.md"
  results_doc: "docs/PHASE28/PHASE28-4_RESULTS.md"
