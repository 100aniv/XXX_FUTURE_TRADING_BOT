  atr_mult_sl: 1.272          # Stop Loss multiplier (ATR-based)
  max_hold_minutes: 23        # Maximum hold time (minutes)
  
  # Signal Parameters (RSI-based)
  rsi_oversold: 27            # Oversold threshold (buy signal)
  rsi_overbought: 71          # Overbought threshold (sell signal)
  
  # EMA Parameters (Trend-aware)
  ema_fast: 8                 # Fast EMA period
  ema_slow: 32                # Slow EMA period
  
  # Pattern Detection
  max_cross_age_candles: 10   # Fresh cross age (candles)
  momentum_lookback: 6        # Momentum pattern lookback
  volume_mult: 1.213          # Volume spike multiplier
  
  # Filters
  filters:
    allow_short: false        # Short positions disabled

