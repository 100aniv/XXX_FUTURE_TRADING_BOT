# ========================================
# Key Insights
# ========================================
# 1. **max_cross_age 확대 (12 → 17)**: 진입 기회 증가에 기여
# 2. **RSI oversold 강화 (30 → 24)**: 더 극단적인 조건, 정확도 증가
# 3. **RR 유지 (1.3 → 1.4)**: TP 도달은 여전히 어려움
# 4. **Short 허용 효과**: 양방향 거래로 기회 증가

