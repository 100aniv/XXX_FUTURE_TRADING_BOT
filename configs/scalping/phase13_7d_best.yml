# PHASE13 Best Parameters (7-day tuning)
# ========================================
# Study: phase13_3m_7d_test
# Best Trial: #7 (Score: 3.553)
# Period: 2024-11-01 ~ 2024-11-07 (7 days)
# Performance: PF=0.220, WR=33.3%, Trades=21, MDD=4.25%

scalping:
  timeframe: 3m
  
  # Core Risk Parameters (Optimized)
  rr: 1.414                          # Trial #7: 1.4139734361668985
  atr_mult_sl: 1.256                 # Trial #7: 1.2564710291701384
  max_cross_age_candles: 17          # Fresh Cross 시간 제약 완화
  
  # Signal Parameters (Optimized)
  rsi_oversold: 24                   # 과매도 기준 (더 극단)
  rsi_overbought: 70                 # 과매수 기준
  volume_mult: 1.060                 # Trial #7: 1.059797122969151
  
  # EMA Parameters
  ema_fast: 13
  ema_slow: 46
  
  # Other Parameters
  momentum_lookback: 5
  max_hold_minutes: 32
  entry_cooldown_seconds: 5
  
  # Pattern Toggles
  enable_pattern_a: true             # Fresh Trend + RSI
  enable_pattern_b: true             # Fresh Trend + Volume
  enable_pattern_c: false
  enable_pattern_d: false
  enable_pattern_e: false
  enable_mean_reversion: false       # MR 비활성
  
  # Filters
  filters:
    allow_short: true                # Trial #7: Short 허용
  
  # BB Parameters (for MR, if enabled)
  bb_window: 20
  bb_std: 2.0

