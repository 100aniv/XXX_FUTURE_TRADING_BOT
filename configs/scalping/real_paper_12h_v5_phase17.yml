# PHASE17 REAL PAPER 12h V5 테스트 설정
# V4 → V5: Volume Guard 완화 + Entry Cooldown 추가

paper:
  duration_hours: 12
  duration_mode: wall_clock
  clean_start: true  # 포지션 초기화

# ⭐ PHASE17: Position Sizing 강화 (V4와 동일)
position_sizing:
  min_position_notional: 100
  max_position_notional: 15000
  multi_position_scaling: true  # 동시 포지션 수에 따른 크기 자동 조정
  exposure_reduction_factor: 0.95
  allow_partial_entry: true  # 사이즈 축소 후 진입 허용 (핵심!)
  
  context_scaling:
    enabled: true
    atr_low_pct: 0.004
    atr_high_pct: 0.02
    low_vol_mult: 1.2
    high_vol_mult: 0.7

risk:
  max_drawdown_pct: 25.0
  max_positions: 3
  per_trade: 0.003
  max_exposure_per_symbol: 0.35
  max_exposure_pct: 0.95

portfolio:
  symbol_cooldown_seconds: 90
  max_total_exposure: 0.95
  max_strategy_positions: 10  # V5: 5 → V5b: 10 (Portfolio Budget 2배 증가, Entry BLOCK 해결)

# ⭐ PHASE17 V5 변경 1: Volume Guard 비활성화 (완전한 해결)
enable_vol_spike_filter: false  # V4: true → V5: false (Volume Guard 완전 비활성화)
vol_spike_mult: 4.0  # 백업용 (비활성화 시 사용 안 됨)

strategies:
  scalping:
    # ⭐ PHASE17 V5 변경 2: Entry Cooldown 추가
    entry_cooldown_seconds: 20  # V4: 0 → V5: 20 (과도 Entry 방지, 실전 안정성 향상)

logging:
  level: INFO

# ⭐ PHASE17 V5 설계 목표:
# 1. Volume Guard 완화 (2.5 → 4.0): 정상 거래량 변동 허용, Entry 중단 방지
# 2. Entry Cooldown 추가 (0 → 20초): 초기 급증 방지, 적절한 Entry 간격 확보
# 3. PHASE17 핵심 기능 유지: Multi-position Scaling, ALLOW_REDUCED, Exposure Guard 3단계
# 4. 실행 목표: 3시간+, Entry ≥50개, ALLOW_REDUCED 70%+
