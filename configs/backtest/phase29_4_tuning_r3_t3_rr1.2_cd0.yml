  flash_guard:
    enabled: false
  cooldown:
    enabled: false
  min_trade_interval_seconds: 0
fees:
  maker: 0.0002
  taker: 0.0004
  slippage_bps: 5
flow_guardian:
  enabled: false
  throttles:
    entry_burst: 100
    entry_sustained: 100
    exit_burst: 100
    exit_sustained: 100
  blocks:
    max_rejected_per_hour: 100
    max_failed_per_hour: 100
    emergency_stop: false
trade_activity_tracker:
  enabled: true
  log_interval: 300
  output_file: reports/backtest/phase29_4_1/phase29_4_tuning_r3_t3_rr1.2_cd0_summary.json
monitoring:
