mode: backtest
env: backtest
run_id: phase29_4_tuning_r3_t3_rr1.2_cd0
symbol: BTCUSDT
timeframe: 5m
lookback: 1000
backtest:
  symbol: BTCUSDT
  data_dir: data
  data_file: BTCUSDT_5m_2024-01-01_2024-12-31.csv
  start_date: '2024-11-01 00:00:00'
  end_date: '2024-12-01 00:00:00'
