# ========================================
# PHASE28-1-FIX: Single Strategy Performance Baseline
# btc5m_baseline_v1 전략 성능 측정 Config
# PHASE27-5 구조 기반으로 Zero-Trade 버그 수정
# ========================================

# ========================================
# 실행 모드 & 환경
# ========================================
mode: backtest
env: backtest

# ========================================
# 심볼 & Timeframe
# ========================================
symbol: BTCUSDT
timeframe: 5m
lookback: 1000

# ========================================
# Backtest 설정
# ========================================
backtest:
  symbol: BTCUSDT
  data_dir: data
  data_file: BTCUSDT_5m_2024-01-01_2024-12-31.csv
  start_date: "2024-11-30"
  end_date: "2024-12-30"

# ========================================
# Strategy 선택 (단일 전략)
# ========================================
strategy:
  selector: btc5m_baseline_v1
  use_ensemble: false

# ========================================
# Capital & Equity
# ========================================
capital:
  initial: 50000

equity: 50000

# ========================================
# Portfolio 설정
# ========================================
portfolio:
  initial_balance: 50000.0
  currency: USDT
  max_open_positions: 3
  max_symbol_exposure_pct: 30
  max_exposure_pct: 60
  max_total_exposure: 0.6
  max_strategy_positions: 2
  use_dynamic_exposure: true
  use_dynamic_budget: true
  symbol_cooldown_seconds: 60

# ========================================
# Position Sizing
# ========================================
position_sizing:
  default_risk_per_trade: 0.02
  mode: kelly_fraction
  kelly_fraction: 0.25
  leverage: 3.0
  min_position_size: 0.001
  max_position_size: 10.0

# ========================================
# Risk Management
# ========================================
risk:
  max_open_positions: 3
  max_risk_per_trade: 0.03
  max_portfolio_risk: 0.1
  max_daily_loss: 0.05
  max_consecutive_losses: 5
  drawdown_threshold: 0.15
  risk_free_rate: 0.0

# ========================================
# Exits
# ========================================
exits:
  use_trailing_stop: false
  trailing_stop_pct: 0.02
  use_time_exit: true
  max_hold_minutes: 180
  emergency_exit:
    enabled: true
    loss_threshold: 0.10

# ========================================
# FlowGuardian
# ========================================
flow_guardian:
  enabled: true
  cooldown:
    enabled: true
    seconds: 60
  budget_cap:
    enabled: true
  position_safety:
    enabled: true
    max_positions: 3
  strategy_diversity:
    enabled: false
    min_active_strategies: 1

# ========================================
# 전략별 파라미터 - BTC 5m Baseline V1
# (PHASE27-5 방식: params 키 없이 직접 배치)
# ========================================
strategies:
  btc5m_baseline_v1:
    # 신호 조건 (PHASE27-4 Grid Search Top 1)
    rsi_long_threshold: 42
    rsi_short_threshold: 58
    bb_std_main: 1.2
    bb_std_strong: 1.5
    momentum_lookback: 5
    momentum_threshold: 0.001
    
    # ADX 레짐 설정
    use_adx: true
    adx_period: 14
    adx_trend_threshold: 20
    
    # 위험 관리
    rr: 1.5
    atr_mult_sl: 1.5
    max_hold_minutes: 60
    min_bars_for_signal: 50
    
    # Filters
    filters:
      allow_short: true
    
    # Leverage
    leverage:
      min: 1
      max: 5
      default: 3

# ========================================
# Indicators 설정 (ADX 지표 활성화)
# ========================================
indicators:
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200
  rsi_len: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_len: 20
  bb_std: 2.0
  atr_len: 14
  vol_ma_len: 30
  dc_len: 20
  use_adx: true
  adx_period: 14

# ========================================
# TradeActivityTracker
# ========================================
trade_activity_tracker:
  enabled: true
  log_interval: 300
  output_file: "reports/phase28_1_btc5m_baseline_tracker_summary.json"

# ========================================
# PHASE28-1: Common Settings (Runner가 병합)
# ========================================
common:
  symbol: BTCUSDT
  timeframe: 5m
  lookback: 1000
  data_dir: data
  data_file: BTCUSDT_5m_2024-01-01_2024-12-31.csv
  initial_equity: 50000.0
  
  # Strategy 선택
  strategy:
    selector: btc5m_baseline_v1
    use_ensemble: false

# ========================================
# PHASE28-1: Market Periods
# ========================================
market_periods:
  bull:
    name: "Bull Trend"
    description: "상승 추세 구간"
    start: "2024-11-01"
    end: "2024-11-30"
  
  range:
    name: "Range Consolidation"
    description: "횡보 구간"
    start: "2024-10-01"
    end: "2024-10-31"
  
  neutral:
    name: "Neutral Period"
    description: "중립 시장 구간"
    start: "2024-11-30"
    end: "2024-12-30"

# ========================================
# PHASE28-1: Smoke Test 구간 정의
# ========================================
smoke_test:
  name: "Smoke Test"
  description: "30일 테스트 (Zero-Trade 버그 검증) - PHASE27-5 구간"
  start: "2024-11-30"
  end: "2024-12-30"

# ========================================
# PHASE28-1: Presets (파라미터 변형)
# ========================================
presets:
  # Baseline: 현재 설정 그대로
  baseline:
    name: "Baseline"
    description: "PHASE27-5 Grid Search Top 1"
    params:
      rsi_long_threshold: 42
      rsi_short_threshold: 58
      bb_std_main: 1.2
      use_adx: true
      adx_trend_threshold: 20
  
  # Conservative: 더 엄격한 진입
  conservative:
    name: "Conservative"
    description: "보수적 진입"
    params:
      rsi_long_threshold: 38
      rsi_short_threshold: 62
      bb_std_main: 1.5
      use_adx: true
      adx_trend_threshold: 25
  
  # Aggressive: 더 완화된 진입
  aggressive:
    name: "Aggressive"
    description: "공격적 진입"
    params:
      rsi_long_threshold: 46
      rsi_short_threshold: 54
      bb_std_main: 1.0
      use_adx: true
      adx_trend_threshold: 15
