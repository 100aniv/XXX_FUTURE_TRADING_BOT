# ========================================
# PHASE29-2B: BTC 5m Baseline V3 - 1주 백테스트 (Scenario A+)
# 목표: Scenario A+ 조건 완화 적용 후 신호율 복구 검증
# 기간: 2024-11-24 00:00:00 ~ 2024-12-01 00:00:00 (7일)
# ========================================

# ========================================
# 실행 모드 & 환경
# ========================================
mode: backtest
env: backtest
run_id: "phase29_2b_btc5m_baseline_v3_week_scenario_a_plus"

# ========================================
# 심볼 & Timeframe
# ========================================
symbol: BTCUSDT
timeframe: 5m
lookback: 1000

# ========================================
# Backtest 설정 (1주)
# ========================================
backtest:
  symbol: BTCUSDT
  data_dir: data
  data_file: BTCUSDT_5m_2024-01-01_2024-12-31.csv
  start_date: "2024-11-24 00:00:00"
  end_date: "2024-12-01 00:00:00"
  duration_minutes: null
  output_file: reports/backtest/phase29_2b/btc5m_baseline_v3_week_scenario_a_plus_summary.json

# ========================================
# Ensemble 설정 (단일 전략 V3 사용)
# ========================================
ensemble:
  enabled: false
  mode: score_v2
  
  strategies:
    - btc5m_baseline_v3
  
  strategy_weights:
    btc5m_baseline_v3: 1.0

# ========================================
# Strategy Selector (V3 단일 전략 직접 사용)
# ========================================
strategy:
  selector: btc5m_baseline_v3
  use_ensemble: false

# ========================================
# Capital
# ========================================
capital:
  initial: 50000

# ========================================
# Execution
# ========================================
execution:
  order_type: MARKET
  timeout_sec: 30
  reject_cooldown_seconds: 0  # Cooldown OFF

# ========================================
# Equity
# ========================================
equity: 50000

# ========================================
# Portfolio 설정
# ========================================
portfolio:
  initial_balance: 50000.0
  currency: USDT
  max_open_positions: 3
  max_symbol_exposure_pct: 50
  max_exposure_pct: 80
  max_total_exposure: 0.8
  max_strategy_positions: 2
  use_dynamic_exposure: true
  use_dynamic_budget: false
  symbol_cooldown_seconds: 0
  enable_strategy_budget_cap: false

# ========================================
# Position Sizing
# ========================================
position_sizing:
  default_risk_per_trade: 0.02
  mode: kelly_fraction
  kelly_fraction: 0.25
  leverage: 3.0
  max_position_size_pct: 0.3
  min_leverage: 1
  max_leverage: 5
  min_reward_risk_ratio: 1.5  # ⭐ Scenario A+: RR 비율 완화 (2.0 → 1.5)
  multi_position_scaling:
    enabled: true
    scale_factor: 0.5
    max_positions: 3

# ========================================
# Risk Management (Guards)
# ========================================
risk:
  # Max Drawdown Guard
  max_drawdown: 0.15  # 15% (PHASE29 기준)
  drawdown_recovery_factor: 0.5
  
  # Daily Loss Guard (Scenario A+: Soft mode)
  daily_loss:
    mode: soft  # Soft 모드 (경고만 발생, 차단 안 함)
    limit_pct: 0.05  # 5% 일일 손실 한도 (참고용)
  
  # Position Budget Cap
  position_limit: 3
  
  # Portfolio-Level Guards
  max_symbol_exposure_pct: 50
  max_total_exposure_pct: 80
  
  # Guard 쿨다운
  guard_cooldown:
    default: 300  # 5분
    GUARD_DAILY_LOSS_LIMIT: 0  # Soft 모드라 적용 안 됨

# ========================================
# Fees & Slippage
# ========================================
fees:
  maker: 0.0002
  taker: 0.0004
  slippage_bps: 5

# ========================================
# Flow Guardian
# ========================================
flow_guardian:
  enabled: true
  throttles:
    entry_burst: 100
    entry_sustained: 100
    exit_burst: 100
    exit_sustained: 100
  blocks:
    max_rejected_per_hour: 100
    max_failed_per_hour: 100
    emergency_stop: false

# ========================================
# TradeActivityTracker
# ========================================
trade_activity_tracker:
  enabled: true
  log_interval: 300
  output_file: "reports/backtest/phase29_2b/btc5m_baseline_v3_week_scenario_a_plus_summary.json"

# ========================================
# Monitoring
# ========================================
monitoring:
  redis:
    host: localhost
    port: 6379
    db: 0
  metrics:
    enabled: false

# ========================================
# Database
# ========================================
database:
  url: ${DATABASE_URL}
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}

# ========================================
# Telegram
# ========================================
telegram:
  token: ${TELEGRAM_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  enabled: false

# ========================================
# Volume Filter 설정
# ========================================
enable_vol_spike_filter: false
vol_spike_mult: 2.0


# ========================================
# 전략별 파라미터 - BTC 5m Baseline V3 (Scenario A+)
# ========================================
strategies:
  btc5m_baseline_v3:
    # === Multi-TP 구조 ===
    atr_mult_sl_trend: 2.0
    atr_mult_sl_range: 1.5
    tp1_mult: 1.2
    tp2_mult: 3.0
    tp1_size_pct: 0.6
    tp2_size_pct: 0.4
    
    # === Regime 기준 ===
    adx_trend_threshold: 25
    adx_range_threshold: 20
    max_hold_minutes_trend: 120
    max_hold_minutes_range: 30
    
    # === RSI/BB (V2 호환) ===
    rsi_long_percentile_base: 25
    rsi_short_percentile_base: 75
    rsi_lookback: 100
    bb_mult_main_base: 1.2
    bb_mult_strong_base: 2.0
    
    # === Momentum ===
    momentum_lookback: 5
    momentum_threshold_base: 0.001
    
    # ⭐ === PHASE29-2B Scenario A+: 조건 완화 (추가 완화) ===
    # Range 모드 RSI threshold 추가 완화
    range_rsi_long_threshold: 40   # 기존 35 → 40 (10pt 완화)
    range_rsi_short_threshold: 60  # 기존 65 → 60 (10pt 완화)
    
    # Range 모드 AND 로직 대폭 완화
    range_min_conditions: 1  # ⭐ 기존 2 → 1 (단일 조건만 만족해도 진입!)
    
    # === V3 필터 (Scenario A+: 추가 완화) ===
    v3_filters:
      enable_min_atr: true
      min_atr_pct: 0.0015    # 기존 0.0018 → 0.0015 (ATR × 0.75)
      enable_volume_filter: true
      min_volume_ratio: 0.5  # 기존 0.65 → 0.5 (Vol ÷ 1.6)
      enable_time_filter: false
    
    # === Regime Detection (V2 모듈 재사용) ===
    regime_detection:
      adx_period: 14
      adx_trend_threshold: 25
      atr_period: 14
      atr_lookback: 50
      atr_high_percentile: 70
      atr_low_percentile: 30
    
    # === 기타 ===
    min_bars_for_signal: 100
    
    # === Filters ===
    filters:
      allow_short: true
    
    # === Leverage ===
    leverage:
      min: 1
      max: 5
      default: 3

# ========================================
# Indicators 설정 (V3용)
# ========================================
indicators:
  ema:
    fast: 5
    mid: 20
    slow: 200
  rsi:
    length: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  bollinger:
    length: 20
    std: 2.0
  atr:
    length: 14
  volume:
    ma_length: 20
  donchian:
    length: 20
  
  # V3 필수: ADX + DI 지표
  adx:
    period: 14

