# ========================================
# PHASE28-11: Profile D - MIXED_RELAXED (혼합 완화, 상용 후보)
# 목표: 쿨다운 + 포트폴리오 혼합 완화 (밸런스 최적화)
# 기간: 2024-10-01 ~ 2024-12-31 (Q4 3개월)
# ========================================

# ========================================
# 실행 모드 & 환경
# ========================================
mode: backtest
env: backtest
run_id: "phase28_11_profile_d_mixed_relaxed"

# ========================================
# 심볼 & Timeframe
# ========================================
symbol: BTCUSDT
timeframe: 5m
lookback: 1000

# ========================================
# Backtest 설정 (3개월 Full Test)
# ========================================
backtest:
  symbol: BTCUSDT
  data_dir: data
  data_file: BTCUSDT_5m_2024-01-01_2024-12-31.csv
  start_date: "2024-10-01 00:00:00"
  end_date: "2024-12-31 23:59:59"
  duration_minutes: null

# ========================================
# Ensemble 설정 (단일 전략 V2 사용)
# ========================================
ensemble:
  enabled: false
  mode: score_v2
  
  strategies:
    - btc5m_baseline_v2
  
  strategy_weights:
    btc5m_baseline_v2: 1.0

# ========================================
# Strategy Selector (V2 단일 전략 직접 사용)
# ========================================
strategy:
  selector: btc5m_baseline_v2
  use_ensemble: false

# ========================================
# Capital
# ========================================
capital:
  initial: 50000

# ========================================
# Execution
# ========================================
execution:
  order_type: MARKET
  timeout_sec: 30
  reject_cooldown_seconds: 0  # ⭐ Cooldown OFF

# ========================================
# Equity
# ========================================
equity: 50000

# ========================================
# Portfolio 설정 (PROFILE D: 혼합 완화 - 중간 수준)
# ========================================
portfolio:
  initial_balance: 50000.0
  currency: USDT
  max_open_positions: 5  # ⭐ PROFILE D: 3 → 5개 (중간)
  max_symbol_exposure_pct: 50  # ⭐ PROFILE D: 50% 유지
  max_exposure_pct: 90  # ⭐ PROFILE D: 80 → 90% (중간)
  max_total_exposure: 0.9  # ⭐ PROFILE D: 0.8 → 0.9 (90% 자본 활용)
  max_strategy_positions: 4  # ⭐ PROFILE D: 2 → 4개 (중간)
  use_dynamic_exposure: true
  use_dynamic_budget: false  # ⭐ Budget Cap OFF
  symbol_cooldown_seconds: 0  # ⭐ Cooldown OFF

# ========================================
# Position Sizing
# ========================================
position_sizing:
  default_risk_per_trade: 0.02
  mode: kelly_fraction
  kelly_fraction: 0.25
  leverage: 3.0
  max_position_size_pct: 0.5  # ⭐ PROFILE D: 0.3 → 0.5 (중간)
  min_leverage: 1
  max_leverage: 5
  multi_position_scaling:
    enabled: true
    scale_factor: 0.05
    min_size_ratio: 0.3

# ========================================
# Risk Management (PROFILE D: 혼합 완화)
# ========================================
risk:
  max_positions: 5  # ⭐ PROFILE D: 3 → 5개 (중간)
  max_daily_loss: 0.05
  max_drawdown: 0.2
  consecutive_loss_limit: 5
  max_consecutive_losses: null  # ⭐ OFF
  cooldown_minutes: 0  # ⭐ OFF
  max_symbol_exposure_pct: 0.5  # ⭐ PROFILE D: 0.3 → 0.5 (중간)
  max_total_exposure_pct: 0.9  # ⭐ PROFILE D: 0.6 → 0.9 (중간)
  flash_guard:
    enabled: false
  cooldown:
    enabled: false
  min_trade_interval_seconds: 0

# ========================================
# Fees
# ========================================
fees:
  maker: 0.0002
  taker: 0.0004
  slippage_bps: 5

# ========================================
# Flow Guardian
# ========================================
flow_guardian:
  enabled: true
  throttles:
    entry_burst: 100
    entry_sustained: 100
    exit_burst: 100
    exit_sustained: 100
  blocks:
    max_rejected_per_hour: 100
    max_failed_per_hour: 100
    emergency_stop: false

# ========================================
# TradeActivityTracker
# ========================================
trade_activity_tracker:
  enabled: true
  log_interval: 300
  output_file: "reports/backtest/phase28_11/profile_d_summary.json"

# ========================================
# Monitoring
# ========================================
monitoring:
  redis:
    host: localhost
    port: 6379
    db: 0
  metrics:
    enabled: false

# ========================================
# Database
# ========================================
database:
  url: ${DATABASE_URL}
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}

# ========================================
# Telegram
# ========================================
telegram:
  token: ${TELEGRAM_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  enabled: false

# ========================================
# PHASE28-11 Profile D: Signal Cooldown 완전 비활성화
# ========================================
disable_signal_cooldown: true  # ⭐ PROFILE D: 쿨다운 완전 제거 (Profile B와 동일)
cooldown_candles: 0

# ========================================
# Volume Filter 설정 (PROFILE D: 활성화 + 완화)
# ========================================
enable_vol_spike_filter: true  # ⭐ PROFILE D: 활성화 (극단적 spike만 차단)
vol_spike_mult: 4.0  # ⭐ PROFILE D: 2.0 → 4.0 (완화)
vol_ma_len: 30  # ⭐ PROFILE D: 거래량 이동평균 기간

# ========================================
# 전략별 파라미터 - BTC 5m Baseline V2
# ========================================
strategies:
  btc5m_baseline_v2:
    # === Regime Detection ===
    adx_period: 14
    adx_trend_threshold: 15
    di_diff_threshold: 3
    atr_high_threshold: 70
    atr_lookback: 100
    
    # === Dynamic Threshold Base ===
    rsi_long_percentile_base: 25
    rsi_short_percentile_base: 75
    rsi_lookback: 100
    
    bb_mult_main_base: 0.8
    bb_mult_strong_base: 1.5
    
    # === Regime Adjustment Factors ===
    bull_rsi_adjustment: 1.2
    bear_rsi_adjustment: 0.85
    high_vol_bb_adjustment: 0.85
    low_vol_bb_adjustment: 1.15
    
    # === Momentum ===
    momentum_lookback: 5
    momentum_threshold_base: 0.001
    
    # === Risk Management ===
    atr_mult_sl: 1.5
    rr: 1.5
    max_hold_minutes: 60
    min_bars_for_signal: 100
    
    # === Position Bias (Regime별) ===
    bull_long_bias: 0.65
    bear_short_bias: 0.65
    
    # === Filters ===
    filters:
      allow_short: true
    
    # === Leverage ===
    leverage:
      min: 1
      max: 5
      default: 3

# ========================================
# Indicators 설정 (V2용 확장)
# ========================================
indicators:
  ema:
    fast: 20
    mid: 50
    slow: 200
  rsi:
    length: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  bollinger:
    length: 20
    std: 2.0
  atr:
    length: 14
  volume:
    ma_length: 30
  donchian:
    length: 20
  
  # V2 전용: ADX + DI 지표 필수
  adx:
    period: 14
