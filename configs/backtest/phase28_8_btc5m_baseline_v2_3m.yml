# ========================================
# PHASE28-8-1: btc5m_baseline_v2 3-Month Extended Baseline Deep Dive
# 목표: V2 전략 3개월 연속 행동 진단 (Regime/Signal/Order Funnel 분석)
# 데이터: 2024-08-01 ~ 2024-10-31 (Bear + Range + Bull, 92일)
# ========================================

# ========================================
# 실행 모드 & 환경
# ========================================
mode: backtest
env: backtest
run_id: "phase28_8_btc5m_baseline_v2_3m"

# ========================================
# 심볼 & Timeframe
# ========================================
symbol: BTCUSDT
timeframe: 5m
lookback: 1000

# ========================================
# Backtest 설정 (3개월 연속)
# ========================================
backtest:
  symbol: BTCUSDT
  data_dir: data
  data_file: BTCUSDT_5m_2024-01-01_2024-12-31.csv
  start_date: "2024-08-01"
  end_date: "2024-10-31"

# ========================================
# Ensemble 설정 (단일 전략 V2 사용)
# ========================================
ensemble:
  enabled: false
  mode: score_v2
  
  strategies:
    - btc5m_baseline_v2
  
  strategy_weights:
    btc5m_baseline_v2: 1.0
  
  high_conf_threshold: 0.4
  consensus_threshold: 0.2
  min_strategies: 1
  max_strategy_weight: 1.0
  
  max_risk: 0.95
  min_quality: 0.1

# ========================================
# 자본금 & 레버리지
# ========================================
capital:
  initial_balance: 50000.0
  currency: USDT
  max_leverage: 3.0

# ========================================
# Execution 설정
# ========================================
execution:
  order_type: MARKET
  timeout_sec: 30
  reject_cooldown_seconds: 60

# ========================================
# Portfolio 설정
# ========================================
portfolio:
  allocation:
    btc5m_baseline_v2: 0.2
  
  max_positions: 3
  equity_reserve: 0.1

# ========================================
# Position Sizing
# ========================================
position_sizing:
  method: risk_based
  base_risk_pct: 0.02
  risk_multiplier_long: 1.0
  risk_multiplier_short: 1.0
  max_position_value_ratio: 0.3
  
  min_position_value: 100.0
  max_position_value: 15000.0
  
  enforce_capital_limit: true
  capital_reserve_ratio: 0.1

# ========================================
# Risk Management
# ========================================
risk:
  max_equity_risk: 0.10
  max_position_risk: 0.05
  max_daily_loss: 0.05
  max_leverage: 3.0
  
  max_drawdown: 0.20
  max_positions: 3
  
  allow_add_to_position: false

# ========================================
# Exit 설정
# ========================================
exits:
  default_stop_loss_pct: 0.02
  default_take_profit_pct: 0.04
  trailing_stop_activation: 0.015
  trailing_stop_callback: 0.01
  
  use_time_exit: true
  time_exit_candles: 288

# ========================================
# FlowGuardian 설정
# ========================================
flow_guardian:
  enabled: true
  mode: balanced
  
  max_trades_per_day: 10
  max_trades_per_hour: 3
  
  cooldown_after_loss_minutes: 30
  cooldown_after_win_minutes: 5
  
  require_trend_confirmation: false
  min_volume_ratio: 0.5

# ========================================
# TradeActivityTracker 설정
# ========================================
trade_activity_tracker:
  enabled: true
  report_path: "reports/backtest/phase28_8/baseline_3m_summary.json"

# ========================================
# Monitoring 설정
# ========================================
monitoring:
  log_level: INFO
  save_logs: true
  log_dir: logs/application
  
  metrics_enabled: true
  save_trades: true
  save_signals: false

# ========================================
# Database 설정
# ========================================
database:
  save_trades: true
  save_decisions: false
  save_metrics: false

# ========================================
# Telegram 알림 (비활성화)
# ========================================
telegram:
  enabled: false

# ========================================
# 전략: btc5m_baseline_v2 Baseline 파라미터
# ========================================
strategies:
  btc5m_baseline_v2:
    # Baseline 파라미터 (PHASE28-6 설계 기준)
    # Regime Detection (ADX + DI+/DI-)
    adx_period: 14
    adx_trend_threshold: 25.0
    di_diff_threshold: 10.0
    
    # Volatility (ATR)
    atr_period: 14
    atr_high_percentile: 70.0
    atr_low_percentile: 30.0
    
    # RSI Dynamic Threshold
    rsi_period: 14
    rsi_percentile_oversold: 20.0
    rsi_percentile_overbought: 80.0
    
    # Bollinger Bands Dynamic Threshold
    bb_period: 20
    bb_base_multiplier: 2.0
    bb_vol_adjustment_factor: 0.3
    
    # Momentum
    momentum_period: 10
    momentum_threshold_bull: 0.002
    momentum_threshold_bear: -0.002
    momentum_threshold_range: 0.001
    
    # Risk/Reward
    risk_reward_ratio: 1.5
    
    # Position Bias per Regime
    long_bias_bull: 0.65
    short_bias_bear: 0.65
    
    # Enable/Disable
    enable_long: true
    enable_short: true

# ========================================
# 지표 설정
# ========================================
indicators:
  adx:
    period: 14
  
  rsi:
    periods: [14]
  
  bb:
    periods: [20]
    std_devs: [2.0]
  
  atr:
    periods: [14]
  
  sma:
    periods: [20, 50]
  
  ema:
    periods: [12, 26]
