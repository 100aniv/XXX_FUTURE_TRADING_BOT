# ========================================
# PHASE29-2B: BTC 5m Baseline V3 - 1개월 백테스트 (Scenario A+)
# 목표: Scenario A+ 조건 완화 적용 후 장기 성능 검증
# 기간: 2024-11-01 00:00:00 ~ 2024-12-01 00:00:00 (30일)
# ========================================

# ========================================
# 실행 모드 & 환경
# ========================================
mode: backtest
env: backtest
run_id: "phase29_2b_btc5m_baseline_v3_month_scenario_a_plus"

# ========================================
# 심볼 & Timeframe
# ========================================
symbol: BTCUSDT
timeframe: 5m
lookback: 1000

# ========================================
# Backtest 설정 (1개월)
# ========================================
backtest:
  symbol: BTCUSDT
  data_dir: data
  data_file: BTCUSDT_5m_2024-01-01_2024-12-31.csv
  start_date: "2024-11-01 00:00:00"
  end_date: "2024-12-01 00:00:00"
  duration_minutes: null
  output_file: reports/backtest/phase29_2b/btc5m_baseline_v3_month_scenario_a_plus_summary.json

# ========================================
# Ensemble 설정 (단일 전략 V3 사용)
# ========================================
ensemble:
  enabled: false
  mode: score_v2
  
  strategies:
    - btc5m_baseline_v3
  
  strategy_weights:
    btc5m_baseline_v3: 1.0

# ========================================
# Strategy Selector (V3 단일 전략 직접 사용)
# ========================================
strategy:
  selector: btc5m_baseline_v3
  use_ensemble: false

# ========================================
# Capital
# ========================================
capital:
  initial: 50000

# ========================================
# Execution
# ========================================
execution:
  order_type: MARKET
  timeout_sec: 30
  reject_cooldown_seconds: 0  # Cooldown OFF

# ========================================
# Equity
# ========================================
equity: 50000

# ========================================
# Portfolio 설정
# ========================================
portfolio:
  initial_balance: 50000.0
  currency: USDT
  max_open_positions: 3
  max_symbol_exposure_pct: 50
  max_exposure_pct: 80
  max_total_exposure: 0.8
  max_strategy_positions: 2
  use_dynamic_exposure: true
  use_dynamic_budget: false
  symbol_cooldown_seconds: 0
  enable_strategy_budget_cap: false

# ========================================
# Position Sizing
# ========================================
position_sizing:
  default_risk_per_trade: 0.02
  mode: kelly_fraction
  kelly_fraction: 0.25
  leverage: 3.0
  max_position_size_pct: 0.3
  min_leverage: 1
  max_leverage: 5
  multi_position_scaling:
    enabled: true
    scale_factor: 0.5
    max_positions: 3

# ========================================
# Risk Management (Guards)
# ========================================
risk:
  # Max Drawdown Guard
  max_drawdown: 0.15  # 15% (PHASE29 기준)
  drawdown_recovery_factor: 0.5
  
  # Daily Loss Guard (Scenario A+: Soft mode)
  daily_loss:
    mode: soft  # Soft 모드 (경고만 발생, 차단 안 함)
    limit_pct: 0.05  # 5% 일일 손실 한도 (참고용)
  
  # Position Budget Cap
  position_limit: 3
  
  # Portfolio-Level Guards
  max_symbol_exposure_pct: 50
  max_total_exposure_pct: 80
  
  # Guard 쿨다운
  guard_cooldown:
    default: 300  # 5분
    GUARD_DAILY_LOSS_LIMIT: 0  # Soft 모드라 적용 안 됨

# ========================================
# FlowGuardian (Flow Control)
# ========================================
flow_guardian:
  enabled: true
  consecutive_signal_cooldown_seconds: 600  # 10분
  consecutive_signal_limit: 3
  signal_spike_threshold: 5
  signal_spike_window_minutes: 60
  consecutive_rejection_limit: 3
  consecutive_rejection_window_minutes: 30

# ========================================
# Indicators
# ========================================
indicators:
  atr_period: 14
  adx_period: 14
  ema_fast: 8
  ema_slow: 21
  rsi_period: 14
  bb_period: 20
  bb_std: 2.0

# ========================================
# Strategy Configs (btc5m_baseline_v3)
# ========================================
strategies:
  btc5m_baseline_v3:
      # === Regime 기준 ===
      adx_trend_threshold: 25  # Trend 모드 진입 ADX threshold
      adx_range_threshold: 20  # Range 모드 진입 ADX threshold
      
      # === Multi-TP 구조 (Trend 모드) ===
      atr_mult_sl_trend: 2.0  # Trend 모드 SL 거리 (ATR 배수)
      tp1_mult: 1.2  # 1차 TP 배수 (SL distance 대비)
      tp2_mult: 3.0  # 2차 TP 배수 (SL distance 대비)
      tp1_size_pct: 0.6  # 1차 TP 포지션 비율 (60%)
      tp2_size_pct: 0.4  # 2차 TP 포지션 비율 (40%)
      
      # === Multi-TP 구조 (Range 모드) ===
      atr_mult_sl_range: 1.5  # Range 모드 SL 거리 (ATR 배수)
      
      # === 홀드 타임 ===
      max_hold_minutes_trend: 120  # Trend 모드 최대 홀드 타임 (분)
      max_hold_minutes_range: 30  # Range 모드 최대 홀드 타임 (분)
      
      # === Trend 모드 RSI/BB 조건 ===
      rsi_long_threshold: 45  # Trend LONG 진입 RSI threshold
      rsi_short_threshold: 55  # Trend SHORT 진입 RSI threshold
      bb_std_main: 1.2  # BB Main 진입 밴드 (std 배수)
      bb_std_strong: 2.0  # BB Strong 진입 밴드 (std 배수)
      
      # === Range 모드 RSI 조건 (Scenario A+ 완화) ===
      range_rsi_long_threshold: 40  # Range LONG 진입 RSI threshold (30 → 40)
      range_rsi_short_threshold: 60  # Range SHORT 진입 RSI threshold (70 → 60)
      range_min_conditions: 2  # Range 모드 AND 조건 최소 충족 수 (3 → 2)
      
      # === Momentum 조건 ===
      momentum_lookback: 5  # Momentum 계산 lookback 캔들 수
      momentum_threshold: 0.001  # Momentum 변화율 threshold
      
      # === V3 필터 설정 (Scenario A+ 완화) ===
      v3_filters:
        min_atr_pct: 0.0015  # 최소 ATR 필터 (0.15%, 0.002 → 0.0015)
        min_volume_ratio: 0.5  # 최소 Volume 비율 (MA20 대비 50%, 0.8 → 0.5)
        enable_min_atr: true
        enable_volume_filter: true
        enable_time_filter: false  # 시간대 필터 비활성화
        
        # 시간대 필터 (사용 안 함)
        allowed_hours:
          - [0, 24]  # 24시간 허용
      
      # === 기타 ===
      allow_short: true  # SHORT 포지션 허용

# ========================================
# Logging
# ========================================
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/backtest/phase29_2b/btc5m_baseline_v3_month_scenario_a_plus.log
  console: true

# ========================================
# ActivityTracker (Backtest용 메트릭 수집)
# ========================================
activity:
  enabled: true
  db_path: data/activity_backtest.db
  collect_metrics: true
