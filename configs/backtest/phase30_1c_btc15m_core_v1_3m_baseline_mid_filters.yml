# ========================================
# PHASE30-1c: BTC 15m Core V1 - 3개월 Baseline (Mid-Strength Filters)
# 목표: 거래량/품질 균형점 찾기 (80~100건/3M, 월 27~33건)
# 변경: min_confidence 0.2→0.25, min_atr_pct 0.0015→0.00175, min_volume_ratio 0.5→0.6
# 기대: Win Rate 35~40%, PF ≥1.0, Max DD ≤12%
# 기간: 2024-09-01 00:00:00 ~ 2024-12-01 00:00:00 (91일)
# ========================================

# ========================================
# 실행 모드 & 환경
# ========================================
mode: backtest
env: backtest
run_id: "phase30_1c_btc15m_core_v1_3m_baseline_mid_filters"

# ========================================
# 심볼 & Timeframe
# ========================================
symbol: BTCUSDT
timeframe: 15m
lookback: 1000

# ========================================
# Backtest 설정 (3개월)
# ========================================
backtest:
  symbol: BTCUSDT
  data_dir: data
  data_file: BTCUSDT_15m_2024-01-01_2024-12-31.csv
  start_date: "2024-09-01 00:00:00"
  end_date: "2024-12-01 00:00:00"
  duration_minutes: 131040  # 91일 = 131040분
  output_file: reports/backtest/phase30_1c/btc15m_core_v1_3m_baseline_mid_filters_summary.json

# ========================================
# Ensemble 설정 (단일 전략 Core V1 사용)
# ========================================
ensemble:
  enabled: false
  mode: score_v2
  
  strategies:
    - btc15m_core_v1
  
  strategy_weights:
    btc15m_core_v1: 1.0

# ========================================
# Strategy Selector (Core V1 단일 전략)
# ========================================
strategy:
  selector: btc15m_core_v1
  use_ensemble: false

# ========================================
# Capital
# ========================================
capital:
  initial: 50000

# ========================================
# Execution
# ========================================
execution:
  order_type: MARKET
  timeout_sec: 30
  reject_cooldown_seconds: 0

# ========================================
# Entries (Guard ON)
# ========================================
entries:
  cooldown_candles: 2          # 쿨다운 ON (15m * 2 = 30분)
  min_rr_required: 1.5         # RR 필터 ON (Core V1 최소 RR)

# ========================================
# Equity
# ========================================
equity: 50000

# ========================================
# Portfolio 설정
# ========================================
portfolio:
  initial_balance: 50000.0
  currency: USDT
  max_open_positions: 1  # 단일 심볼, 최대 1 포지션
  max_symbol_exposure_pct: 50
  max_exposure_pct: 80
  max_total_exposure: 0.8
  max_strategy_positions: 1
  use_dynamic_exposure: true
  use_dynamic_budget: false
  symbol_cooldown_seconds: 0
  enable_strategy_budget_cap: false

# ========================================
# Position Sizing
# ========================================
position_sizing:
  default_risk_per_trade: 0.02
  mode: kelly_fraction
  kelly_fraction: 0.25
  leverage: 3.0
  max_position_size_pct: 0.3
  min_leverage: 1
  max_leverage: 5
  multi_position_scaling:
    enabled: false  # 단일 포지션
    scale_factor: 0.05
    min_size_ratio: 0.3

# ========================================
# Risk Management (Guard ON - MID STRENGTH)
# ========================================
risk:
  max_positions: 1
  max_exposure_per_symbol: 0.3
  max_symbol_exposure_pct: 0.3
  max_total_exposure_pct: 0.6
  max_drawdown: 0.12  # 12% Max DD
  consecutive_loss_limit: 10
  max_consecutive_losses: 10
  cooldown_minutes: 0
  
  # Daily Loss Guard SOFT (5%)
  daily_loss:
    mode: soft
    soft_limit_pct: 0.05
    hard_limit_pct: 0.10
  
  enforce_daily_loss_in_backtest: true
  
  flash_guard:
    enabled: false
  cooldown:
    enabled: false
  min_trade_interval_seconds: 0

# ========================================
# Fees
# ========================================
fees:
  maker: 0.0002
  taker: 0.0004
  slippage_bps: 5

# ========================================
# Flow Guardian (Guard ON - MID STRENGTH)
# ========================================
flow_guardian:
  enabled: true
  
  # Volatility Guard - MID STRENGTH
  volatility:
    enabled: true
    min_atr_pct: 0.00175  # ⭐ MID: 0.0015 (1b) → 0.00175 (1c)
    lookback_candles: 20
  
  # Volume Guard - MID STRENGTH
  volume:
    enabled: true
    min_volume_ratio: 0.6  # ⭐ MID: 0.5 (1b) → 0.6 (1c)
    lookback_candles: 20
  
  # Drawdown Guard
  drawdown:
    enabled: true
    max_drawdown_pct: 0.12
    check_interval_seconds: 60
  
  # Consecutive Loss Guard
  consecutive_loss:
    enabled: true
    max_consecutive_losses: 10
    cooldown_minutes: 30

# ========================================
# Logging
# ========================================
logging:
  level: INFO
  log_trades: true
  log_signals: true
  log_regime: true  # Core V1 Regime 로그

# ========================================
# Database
# ========================================
database:
  enabled: true
  connection_string: "postgresql://trading_user:trading_pass@localhost:5432/trading"
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  pool_recycle: 3600
  echo: false

# ========================================
# Redis
# ========================================
redis:
  enabled: true
  host: localhost
  port: 6379
  db: 0
  decode_responses: true
  socket_timeout: 5
  socket_connect_timeout: 5
  retry_on_timeout: true
  health_check_interval: 30

# ========================================
# 전략별 파라미터 - BTC 15m Core V1 (MID STRENGTH)
# ========================================
strategies:
  btc15m_core_v1:
    # === Regime Detection 파라미터 - MID STRENGTH ===
    regime_detection:
      adx_trend_threshold: 25
      adx_range_threshold: 20
      atr_high_vol_mult: 1.5
      volume_high_vol_mult: 2.0
      min_confidence: 0.25  # ⭐ MID: 0.2 (1b) → 0.25 (1c)
    
    # === Core AND 필터 설정 - MID STRENGTH ===
    filters:
      min_atr_pct: 0.00175  # ⭐ MID: 0.0015 (1b) → 0.00175 (1c)
      min_volume_ratio: 0.6  # ⭐ MID: 0.5 (1b) → 0.6 (1c)
    
    # === SL/TP 설정 (Regime별) - UNCHANGED ===
    sl_tp:
      # Trend Mode
      sl_mult_trend: 2.0
      tp1_rr_trend: 1.5
      tp2_rr_trend: 3.0
      # Range Mode
      sl_mult_range: 1.5
      tp1_rr_range: 1.5
      tp2_rr_range: 2.5
    
    # === 기타 설정 ===
    min_bars_for_signal: 100
    leverage:
      min: 1
      max: 5
      default: 3

# ========================================
# Indicators 설정 (Core V1용)
# ========================================
indicators:
  ema:
    mid: 20
    mid2: 50
    slow: 200
  rsi:
    length: 14
  atr:
    length: 14
  volume:
    ma_length: 20
  adx:
    period: 14
  bollinger:
    length: 20
    std: 2.0

# ========================================
# Analysis & Reporting
# ========================================
analysis:
  enabled: true
  output_dir: reports/analysis/PHASE30
  generate_plots: false
  metrics:
    - win_rate
    - max_drawdown
    - profit_factor
    - sharpe_ratio
    - trades_per_month
    - avg_win
    - avg_loss
    - consecutive_losses
