# ========================================
# PHASE30-1: BTC 15m Core V1 - 3개월 Baseline (Guard ON)
# 목표: Core V1 전략 3개월 성능 검증 (Guard ON 전제)
# 기간: 2024-09-01 00:00:00 ~ 2024-12-01 00:00:00 (91일)
# ========================================

# ========================================
# 실행 모드 & 환경
# ========================================
mode: backtest
env: backtest
run_id: "phase30_1_btc15m_core_v1_3m_baseline"

# ========================================
# 심볼 & Timeframe
# ========================================
symbol: BTCUSDT
timeframe: 15m
lookback: 1000

# ========================================
# Backtest 설정 (3개월)
# ========================================
backtest:
  symbol: BTCUSDT
  data_dir: data
  data_file: BTCUSDT_15m_2024-01-01_2024-12-31.csv
  start_date: "2024-09-01 00:00:00"
  end_date: "2024-12-01 00:00:00"
  duration_minutes: 131040  # 91일 = 131040분
  output_file: reports/backtest/phase30_1/btc15m_core_v1_3m_baseline_summary.json

# ========================================
# Ensemble 설정 (단일 전략 Core V1 사용)
# ========================================
ensemble:
  enabled: false
  mode: score_v2
  
  strategies:
    - btc15m_core_v1
  
  strategy_weights:
    btc15m_core_v1: 1.0

# ========================================
# Strategy Selector (Core V1 단일 전략)
# ========================================
strategy:
  selector: btc15m_core_v1
  use_ensemble: false
  
  # Core V1 전략 파라미터
  params:
    btc15m_core_v1:
      # Regime Detection 설정
      regime_detection:
        adx_trend_threshold: 25
        adx_range_threshold: 20
        atr_high_vol_mult: 1.5
        volume_high_vol_mult: 2.0
        min_confidence: 0.3
      
      # Core AND 필터 설정
      filters:
        min_atr_pct: 0.002  # 0.2%
        min_volume_ratio: 0.7  # 평균 대비 70%
      
      # SL/TP 설정 (Regime별)
      sl_tp:
        # Trend Mode
        sl_mult_trend: 2.0
        tp1_rr_trend: 1.5
        tp2_rr_trend: 3.0
        
        # Range Mode
        sl_mult_range: 1.5
        tp1_rr_range: 1.5
        tp2_rr_range: 2.5
      
      # 지표 설정
      indicators:
        rsi:
          length: 14
        ema:
          mid: 20
          mid2: 50
          slow: 200
        atr:
          length: 14
        volume:
          ma_length: 20
        adx:
          period: 14
        bollinger:
          length: 20
          std: 2.0
      
      # 기타 설정
      min_bars_for_signal: 100
      leverage:
        min: 1
        max: 5
        default: 3

# ========================================
# Capital
# ========================================
capital:
  initial: 50000

# ========================================
# Execution
# ========================================
execution:
  order_type: MARKET
  timeout_sec: 30
  reject_cooldown_seconds: 0

# ========================================
# Entries (Guard ON - V4와 달리 실제 운영 전제)
# ========================================
entries:
  cooldown_candles: 2          # ⭐ 쿨다운 ON (15m * 2 = 30분)
  min_rr_required: 1.5         # ⭐ RR 필터 ON (Core V1 최소 RR)

# ========================================
# Equity
# ========================================
equity: 50000

# ========================================
# Portfolio 설정
# ========================================
portfolio:
  initial_balance: 50000.0
  currency: USDT
  max_open_positions: 1  # 단일 심볼, 최대 1 포지션
  max_symbol_exposure_pct: 50
  max_exposure_pct: 80
  max_total_exposure: 0.8
  max_strategy_positions: 1
  use_dynamic_exposure: true
  use_dynamic_budget: false
  symbol_cooldown_seconds: 0
  enable_strategy_budget_cap: false

# ========================================
# Position Sizing
# ========================================
position_sizing:
  default_risk_per_trade: 0.02
  mode: kelly_fraction
  kelly_fraction: 0.25
  leverage: 3.0
  max_position_size_pct: 0.3
  min_leverage: 1
  max_leverage: 5
  multi_position_scaling:
    enabled: false  # 단일 포지션
    scale_factor: 0.05
    min_size_ratio: 0.3

# ========================================
# Risk Management (Guard ON)
# ========================================
risk:
  max_positions: 1
  max_exposure_per_symbol: 0.3
  max_symbol_exposure_pct: 0.3
  max_total_exposure_pct: 0.6
  max_drawdown: 0.12  # ⭐ 12% Max DD (Core V1 목표)
  consecutive_loss_limit: 5
  max_consecutive_losses: 5
  cooldown_minutes: 0
  
  # PHASE28-13: Daily Loss Guard SOFT (5%)
  daily_loss:
    mode: soft
    soft_limit_pct: 0.05
    hard_limit_pct: 0.10
  
  enforce_daily_loss_in_backtest: true
  
  flash_guard:
    enabled: false
  cooldown:
    enabled: false
  min_trade_interval_seconds: 0

# ========================================
# Fees
# ========================================
fees:
  maker: 0.0002
  taker: 0.0004
  slippage_bps: 5

# ========================================
# Flow Guardian (Guard ON)
# ========================================
flow_guardian:
  enabled: true  # ⭐ Guard ON (실제 운영 전제)
  
  # Volatility Guard
  volatility:
    enabled: true
    min_atr_pct: 0.002  # Core V1 필터와 동일
    lookback_candles: 20
  
  # Volume Guard
  volume:
    enabled: true
    min_volume_ratio: 0.7  # Core V1 필터와 동일
    lookback_candles: 20
  
  # Drawdown Guard
  drawdown:
    enabled: true
    max_drawdown_pct: 0.12  # 12% (Core V1 목표)
    check_interval_seconds: 60
  
  # Consecutive Loss Guard
  consecutive_loss:
    enabled: true
    max_consecutive_losses: 5
    cooldown_minutes: 30

# ========================================
# Logging
# ========================================
logging:
  level: INFO
  log_trades: true
  log_signals: true
  log_regime: true  # Core V1 Regime 로그

# ========================================
# Database
# ========================================
database:
  enabled: true
  connection_string: "postgresql://trading_user:trading_pass@localhost:5432/trading"
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  pool_recycle: 3600
  echo: false

# ========================================
# Redis
# ========================================
redis:
  enabled: true
  host: localhost
  port: 6379
  db: 0
  decode_responses: true
  socket_timeout: 5
  socket_connect_timeout: 5
  retry_on_timeout: true
  health_check_interval: 30

# ========================================
# Analysis & Reporting
# ========================================
analysis:
  enabled: true
  output_dir: reports/analysis/PHASE30
  generate_plots: false
  metrics:
    - win_rate
    - max_drawdown
    - profit_factor
    - sharpe_ratio
    - trades_per_month
    - avg_win
    - avg_loss
    - consecutive_losses
