# ========================================
# PHASE29-1: BTC 5m Baseline V3 Smoke Test (1-day)
# 목표: V3 전략 플로우 정상 작동 확인 (성능 평가 X)
# 기간: 2024-12-01 00:00:00 ~ 2024-12-02 00:00:00 (1일)
# ========================================

# ========================================
# 실행 모드 & 환경
# ========================================
mode: backtest
env: backtest
run_id: "phase29_1_btc5m_baseline_v3_smoke"

# ========================================
# 심볼 & Timeframe
# ========================================
symbol: BTCUSDT
timeframe: 5m
lookback: 1000

# ========================================
# Backtest 설정 (1일 Smoke Test)
# ========================================
backtest:
  symbol: BTCUSDT
  data_dir: data
  data_file: BTCUSDT_5m_2024-01-01_2024-12-31.csv
  start_date: "2024-12-01 00:00:00"
  end_date: "2024-12-02 00:00:00"
  duration_minutes: null

# ========================================
# Ensemble 설정 (단일 전략 V3 사용)
# ========================================
ensemble:
  enabled: false
  mode: score_v2
  
  strategies:
    - btc5m_baseline_v3
  
  strategy_weights:
    btc5m_baseline_v3: 1.0

# ========================================
# Strategy Selector (V3 단일 전략 직접 사용)
# ========================================
strategy:
  selector: btc5m_baseline_v3
  use_ensemble: false

# ========================================
# Capital
# ========================================
capital:
  initial: 50000

# ========================================
# Execution
# ========================================
execution:
  order_type: MARKET
  timeout_sec: 30
  reject_cooldown_seconds: 0

# ========================================
# Equity
# ========================================
equity: 50000

# ========================================
# Portfolio 설정
# ========================================
portfolio:
  initial_balance: 50000.0
  currency: USDT
  max_open_positions: 3
  max_symbol_exposure_pct: 50
  max_exposure_pct: 80
  max_total_exposure: 0.8
  max_strategy_positions: 2
  use_dynamic_exposure: true
  use_dynamic_budget: false
  symbol_cooldown_seconds: 0

# ========================================
# Position Sizing
# ========================================
position_sizing:
  default_risk_per_trade: 0.02
  mode: kelly_fraction
  kelly_fraction: 0.25
  leverage: 3.0
  max_position_size_pct: 0.3
  min_leverage: 1
  max_leverage: 5
  multi_position_scaling:
    enabled: true
    scale_factor: 0.05
    min_size_ratio: 0.3

# ========================================
# Risk Management (PHASE28-13 Daily Loss Guard 적용)
# ========================================
risk:
  max_positions: 3
  max_daily_loss: 0.05
  max_drawdown: 0.2
  consecutive_loss_limit: 5
  max_symbol_exposure_pct: 0.3
  max_total_exposure_pct: 0.6
  
  # PHASE28-13: Daily Loss Guard
  daily_loss:
    mode: soft
    soft_limit_pct: 0.05  # 5%
  
  enforce_daily_loss_in_backtest: true
  
  flash_guard:
    enabled: false
  cooldown:
    enabled: false
  min_trade_interval_seconds: 0

# ========================================
# Fees
# ========================================
fees:
  maker: 0.0002
  taker: 0.0004
  slippage_bps: 5

# ========================================
# Flow Guardian
# ========================================
flow_guardian:
  enabled: true
  throttles:
    entry_burst: 100
    entry_sustained: 100
    exit_burst: 100
    exit_sustained: 100
  blocks:
    max_rejected_per_hour: 100
    max_failed_per_hour: 100
    emergency_stop: false

# ========================================
# TradeActivityTracker
# ========================================
trade_activity_tracker:
  enabled: true
  log_interval: 300
  output_file: "reports/backtest/phase29_1/smoke_1d_summary.json"

# ========================================
# Monitoring
# ========================================
monitoring:
  redis:
    host: localhost
    port: 6379
    db: 0
  metrics:
    enabled: false

# ========================================
# Database
# ========================================
database:
  url: ${DATABASE_URL}
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}

# ========================================
# Telegram
# ========================================
telegram:
  token: ${TELEGRAM_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  enabled: false

# ========================================
# 전략별 파라미터 - BTC 5m Baseline V3 (PHASE29-1)
# ========================================
strategies:
  btc5m_baseline_v3:
    # === Multi-TP 구조 ===
    atr_mult_sl_trend: 2.0
    atr_mult_sl_range: 1.5
    tp1_mult: 1.2
    tp2_mult: 3.0
    tp1_size_pct: 0.6
    tp2_size_pct: 0.4
    
    # === Regime 기준 ===
    adx_trend_threshold: 25
    adx_range_threshold: 20
    max_hold_minutes_trend: 120
    max_hold_minutes_range: 30
    
    # === RSI/BB (V2 호환) ===
    rsi_long_percentile_base: 25
    rsi_short_percentile_base: 75
    rsi_lookback: 100
    bb_mult_main_base: 1.2
    bb_mult_strong_base: 2.0
    
    # === Momentum ===
    momentum_lookback: 5
    momentum_threshold_base: 0.001
    
    # === V3 필터 ===
    v3_filters:
      enable_min_atr: true
      min_atr_pct: 0.002
      enable_volume_filter: true
      min_volume_ratio: 0.8
      enable_time_filter: false
    
    # === Regime Detection (V2 모듈 재사용) ===
    regime_detection:
      adx_period: 14
      adx_trend_threshold: 25
      atr_period: 14
      atr_lookback: 50
      atr_high_percentile: 70
      atr_low_percentile: 30
    
    # === 기타 ===
    min_bars_for_signal: 100
    
    # === Filters ===
    filters:
      allow_short: true
    
    # === Leverage ===
    leverage:
      min: 1
      max: 5
      default: 3

# ========================================
# Indicators 설정 (V3용 확장)
# ========================================
indicators:
  ema:
    fast: 5
    mid: 20
    slow: 200
  rsi:
    length: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  bollinger:
    length: 20
    std: 2.0
  atr:
    length: 14
  volume:
    ma_length: 20
  donchian:
    length: 20
  
  # V3 필수: ADX + DI 지표
  adx:
    period: 14
