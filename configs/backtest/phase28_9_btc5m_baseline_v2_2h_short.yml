# ========================================
# PHASE28-9: Short 2-hour Backtest (Guard Relaxation Test) (7일) - Regime Detection 정상화 테스트
# 목표: ADX/DI 지표 정상 계산 확인 + Trend Regime 감지 ≥30건
# 기간: 2024-10-01 ~ 2024-10-07 (Bull 구간 7일)
# ========================================

# ========================================
# 실행 모드 & 환경
# ========================================
mode: backtest
env: backtest
run_id: "phase28_9_btc5m_baseline_v2_2h_short"

# ========================================
# 심볼 & Timeframe
# ========================================
symbol: BTCUSDT
timeframe: 5m
lookback: 1000

# ========================================
# Backtest 설정 (7일 Mini Test)
# ========================================
backtest:
  symbol: BTCUSDT
  data_dir: data
  data_file: BTCUSDT_5m_2024-01-01_2024-12-31.csv
  start_date: "2024-10-01 00:00:00"
  end_date: "2024-10-01 02:00:00"
  duration_minutes: null

# ========================================
# Ensemble 설정 (단일 전략 V2 사용)
# ========================================
ensemble:
  enabled: false
  mode: score_v2
  
  strategies:
    - btc5m_baseline_v2
  
  strategy_weights:
    btc5m_baseline_v2: 1.0

# ========================================
# Strategy Selector (V2 단일 전략 직접 사용)
# ========================================
strategy:
  selector: btc5m_baseline_v2
  use_ensemble: false

# ========================================
# Capital
# ========================================
capital:
  initial: 50000

# ========================================
# Execution
# ========================================
execution:
  order_type: MARKET
  timeout_sec: 30
  reject_cooldown_seconds: 0  # ⭐ PHASE28-9: Cooldown 완전 비활성화

# ========================================
# Equity
# ========================================
equity: 50000

# ========================================
# Portfolio 설정
# ========================================
portfolio:
  initial_balance: 50000.0
  currency: USDT
  max_open_positions: 3
  max_symbol_exposure_pct: 50  # ⭐ PHASE28-9: 30 → 50% 완화
  max_exposure_pct: 80  # ⭐ PHASE28-9: 60 → 80% 완화
  max_total_exposure: 0.8
  max_strategy_positions: 2
  use_dynamic_exposure: true
  use_dynamic_budget: false  # ⭐ PHASE28-9: Budget Cap 비활성화
  symbol_cooldown_seconds: 0  # ⭐ PHASE28-9: Cooldown 완전 비활성화

# ========================================
# Position Sizing
# ========================================
position_sizing:
  default_risk_per_trade: 0.02
  mode: kelly_fraction
  kelly_fraction: 0.25
  leverage: 3.0
  max_position_size_pct: 0.3
  min_leverage: 1
  max_leverage: 5
  multi_position_scaling:
    enabled: true
    scale_factor: 0.05
    min_size_ratio: 0.3

# ========================================
# Risk Management
# ========================================
risk:
  max_positions: 3
  max_daily_loss: 0.05
  max_drawdown: 0.2
  consecutive_loss_limit: 5
  max_symbol_exposure_pct: 0.3
  max_total_exposure_pct: 0.6
  flash_guard:
    enabled: false
  cooldown:
    enabled: false
  min_trade_interval_seconds: 0

# ========================================
# Fees
# ========================================
fees:
  maker: 0.0002
  taker: 0.0004
  slippage_bps: 5

# ========================================
# Flow Guardian
# ========================================
flow_guardian:
  enabled: true
  throttles:
    entry_burst: 100
    entry_sustained: 100
    exit_burst: 100
    exit_sustained: 100
  blocks:
    max_rejected_per_hour: 100
    max_failed_per_hour: 100
    emergency_stop: false

# ========================================
# TradeActivityTracker
# ========================================
trade_activity_tracker:
  enabled: true
  log_interval: 300
  output_file: "reports/backtest/phase28_9/short_2h_summary.json"

# ========================================
# Monitoring
# ========================================
monitoring:
  redis:
    host: localhost
    port: 6379
    db: 0
  metrics:
    enabled: false

# ========================================
# Database
# ========================================
database:
  url: ${DATABASE_URL}
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}

# ========================================
# Telegram
# ========================================
telegram:
  token: ${TELEGRAM_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  enabled: false

# ========================================
# 전략별 파라미터 - BTC 5m Baseline V2 (PHASE28-6/7 Baseline)
# ========================================
strategies:
  btc5m_baseline_v2:
    # === Regime Detection ===
    adx_period: 14
    adx_trend_threshold: 15  # ⭐ PHASE28-9: 25 → 15로 완화 (Trend 감지율 향상)
    di_diff_threshold: 3     # ⭐ PHASE28-9: 5 → 3으로 완화
    atr_high_threshold: 70
    atr_lookback: 100
    
    # === Dynamic Threshold Base ===
    rsi_long_percentile_base: 25
    rsi_short_percentile_base: 75
    rsi_lookback: 100
    
    bb_mult_main_base: 0.8
    bb_mult_strong_base: 1.5
    
    # === Regime Adjustment Factors ===
    bull_rsi_adjustment: 1.2
    bear_rsi_adjustment: 0.85
    high_vol_bb_adjustment: 0.85
    low_vol_bb_adjustment: 1.15
    
    # === Momentum ===
    momentum_lookback: 5
    momentum_threshold_base: 0.001
    
    # === Risk Management ===
    atr_mult_sl: 1.5
    rr: 1.5
    max_hold_minutes: 60
    min_bars_for_signal: 100
    
    # === Position Bias (Regime별) ===
    bull_long_bias: 0.65
    bear_short_bias: 0.65
    
    # === Filters ===
    filters:
      allow_short: true
    
    # === Leverage ===
    leverage:
      min: 1
      max: 5
      default: 3

# ========================================
# Indicators 설정 (V2용 확장)
# ========================================
indicators:
  ema:
    fast: 20
    mid: 50
    slow: 200
  rsi:
    length: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  bollinger:
    length: 20
    std: 2.0
  atr:
    length: 14
  volume:
    ma_length: 30
  donchian:
    length: 20
  
  # V2 전용: ADX + DI 지표 필수
  adx:
    period: 14
