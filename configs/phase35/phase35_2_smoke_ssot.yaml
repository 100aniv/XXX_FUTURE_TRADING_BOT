# PHASE35-2 ITER1: 7D Smoke Test SSOT (Single Source of Truth)
# ================================================================
# 목적: PHASE35-2 AC 통과를 위한 최소 튜닝 설정
# 기반: test_simple.yaml + 최소 파라미터 조정
# 원칙: 설정 경로 표준화 + churn 억제 + 리스크 감소

symbol: BTCUSDT
timeframe: 15m
mode: backtest

# Backtest settings
backtest:
  period: custom
  custom:
    start_date: "2024-12-01"
    end_date: "2024-12-08"
  data_file: BTCUSDT_15m_2024-01-01_2024-12-31.csv
  data_dir: data

# Required keys
lookback: 1000
equity: 10000
capital:
  initial: 10000
  per_trade: 0.005  # 0.5% per trade (기존 2% → 감소)

# Strategy selector
strategy:
  use_ensemble: false
  selector: phase35_ensemble_v1
  strict_mode: true

# Strategies config
strategies:
  phase35_ensemble_v1:
    enabled: true
    params:
      # Ensemble configuration (ITER1 튜닝)
      ensemble:
        method: "majority_vote"
        confidence_threshold: 0.95  # 0.5 → 0.95 (신호 품질 극대화)
        min_votes: 2                # 2/3 합의 (기본값)
        cooldown_bars: 0            # 비활성화
      
      # Sub-models configuration
      sub_models:
        trend:
          enabled: true
          weight: 0.4
          ema_fast: 20
          ema_slow: 50
          adx_threshold: 25
        reversion:
          enabled: true
          weight: 0.3
          rsi_period: 14
          rsi_oversold: 30
          rsi_overbought: 70
          bb_period: 20
          bb_std: 2.0
        breakout:
          enabled: true
          weight: 0.3
          lookback: 20
          volume_threshold: 1.5
          volume_ma_period: 20
      
      # Regime filter configuration
      regime_filter:
        enabled: true
        type: "atr_simple"
        atr_period: 14
        thresholds:
          trend_min: 0.015
          range_max: 0.008
      
      # Exit configuration
      exit:
        time_based:
          enabled: true
          holding_max_bars: 48
        adverse_move:
          enabled: true
          atr_multiplier: 1.5
        regime_switch:
          enabled: false
        sl_atr_multiplier: 1.5
        tp_atr_multiplier: 3.0
      
      # Decision trace (품질 차단 사유 기록)
      decision_trace:
        enabled: true
        log_level: "INFO"

# System
system:
  timezone: Asia/Seoul

# Risk (ITER1 튜닝: 리스크 감소)
risk:
  per_trade: 0.005        # 2% → 0.5% (MDD<5% 목표)
  max_position_size: 0.05 # 0.1 → 0.05
  max_leverage: 1         # 3 → 1 (레버리지 제거)
  cooldown_seconds: 1800  # 300 → 1800 (30분 쿨다운, 바 쿨다운과 이중 안전장치)

# Portfolio
portfolio:
  initial_capital: 10000
  budget_cap_enabled: true
  budget_cap_pct: 0.3

# Fees
fees:
  taker: 0.0004
  maker: 0.0002
  slippage: 0.0005

# Leverage
leverage:
  default: 1    # 2 → 1 (레버리지 제거)
  min: 1        # 2 → 1
  max: 1        # 50 → 1

# Indicators
indicators:
  ema:
    fast: 9
    slow: 21
  rsi:
    length: 14
    oversold: 30
    overbought: 70
  atr:
    length: 14
  volume:
    ma_length: 20

# Database (backtest 모드에서는 불필요하지만 엔진 호환성을 위해 포함)
database:
  url: ${DATABASE_URL}
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
