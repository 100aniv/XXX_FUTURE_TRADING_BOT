# PHASE21-1B: Scalping 3m Validation (5min)
# Based on phase21_scalping_solo.yml

mode: paper
duration_mode: wall_clock
duration_hours: 0.083  # 5 minutes

symbols:
  - BTCUSDT

timeframe: 3m

ensemble:
  enabled: false

strategy:
  use_ensemble: false
  selected: scalping
  scalping:
    enabled: true
    params:
      entry_threshold: 0.5
      exit_threshold: 0.3
      max_position_size: 0.1
      stop_loss_pct: 1.0
      take_profit_pct: 0.5

portfolio:
  initial_balance: 50000
  max_position_value: 5000
  max_open_positions: 5

risk:
  max_drawdown_pct: 30.0
  extreme_loss_threshold: -1000
  position_size_mode: kelly_fraction

monitoring:
  log_level: INFO
  log_to_file: true
  metrics_interval_seconds: 60

feed:
  type: binance_websocket
  symbols:
    - BTCUSDT
  timeframes:
    - 3m

broker:
  type: paper
  slippage_pct: 0.05
  commission_pct: 0.1
