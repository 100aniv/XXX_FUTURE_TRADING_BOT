# ========================================
# PHASE23-4: Ensemble Orchestrator V2 - 3H PAPER Validation
# 목표: Score V2 기반 앙상블 시스템의 실제 동작 검증
# ========================================

# ========================================
# 실행 모드 & 환경
# ========================================
mode: paper
env: paper
run_id: "PHASE23_4_ENSEMBLE_V2_3H"

# ========================================
# 심볼 & Timeframe
# ========================================
symbol: BTCUSDT
timeframe: 5m

# ========================================
# Ensemble 설정 (Score V2 모드)
# ========================================
ensemble:
  enabled: true  # ⭐ Ensemble 모드 활성화
  mode: score_v2  # ⭐ Score V2 엔진 사용
  
  # 5개 V2 전략 (PHASE23-2에서 통합)
  strategies:
    - scalping_v3
    - volatility_breakout_v2
    - mean_reversion_v2
    - trend_follow_v2
    - volume_based_v2
  
  # 전략별 가중치 (동일 가중치로 시작)
  strategy_weights:
    scalping_v3: 1.0
    volatility_breakout_v2: 1.0
    mean_reversion_v2: 1.0
    trend_follow_v2: 1.0
    volume_based_v2: 1.0
  
  # 3-Tier Decision Thresholds
  high_conf_threshold: 0.7    # Tier 1: abs(S_NET) >= 0.7
  consensus_threshold: 0.4    # Tier 2: weighted avg >= 0.4
  min_strategies: 2           # Tier 2: 최소 2개 전략 동의
  
  # Dominance Prevention
  max_strategy_weight: 0.6    # 단일 전략 기여도 60% 이하
  
  # Risk/Quality Filters
  max_risk: 0.8               # S_RISK > 0.8 시 Skip
  min_quality: 0.3            # S_QUALITY < 0.3 시 Skip

# ========================================
# Strategy Selector (Ensemble 식별용)
# ========================================
strategy:
  selector: ensemble  # 엔진에서 Ensemble 모드 식별

# ========================================
# Paper Trading 설정
# ========================================
paper:
  duration_mode: "wall_clock"  # ⭐ 실제 시계 기준
  duration_hours: 3.0          # 3시간 실행
  clean_start: true            # 깨끗한 시작 (기존 포지션 무시)

# ========================================
# Portfolio 설정 (PHASE17 Production 기준)
# ========================================
portfolio:
  initial_balance: 50000.0     # $50,000 (검증용)
  currency: USDT
  max_open_positions: 3
  max_exposure_pct: 0.9  # 90%

# ========================================
# Position Sizing (PHASE17 Production 기준)
# ========================================
position_sizing:
  default_risk_per_trade: 0.02  # 2% RPT
  mode: kelly_fraction
  kelly_fraction: 0.25
  leverage: 3.0
  max_leverage: 5.0

# ========================================
# Risk Manager (PHASE17 Production 기준)
# ========================================
risk:
  max_daily_loss_pct: 0.10      # 10% 일일 손실 한도
  max_consecutive_losses: 10
  cooldown_after_consecutive: 60
  max_portfolio_dd_pct: 0.15    # 15% 포트폴리오 DD 한도
  max_slippage_pct: 0.5
  extreme_loss_cutoff_pct: -20.0
  profiles:
    paper:
      max_daily_loss_pct: 0.20        # Paper 모드는 완화
      max_consecutive_losses: 15
      cooldown_after_consecutive: 30

# ========================================
# Exits (PHASE17 Production 기준)
# ========================================
exits:
  default_tp_levels:
    - 0.02  # +2%
    - 0.04  # +4%
  default_sl_pct: 0.015  # -1.5%
  trailing_enabled: true
  trailing_activation_pct: 0.01
  trailing_callback_pct: 0.005

# ========================================
# FlowGuardian (Production 기준)
# ========================================
flow_guardian:
  enabled: true
  selftest:
    max_runtime_sec: 120
    require_metrics:
      - profit_factor
      - winrate
      - score_total
      - exp_score
    min_profit_factor: 0.0
    min_winrate: 0.0
    consistency_checks:
      db_vs_json_score_equal: true
      signals_no_nan: true
      risk_never_oversize: true
    snapshot_rules:
      require_segment_isolation: true
    artifacts:
      require_files:
        - logs/trial_0000.json
        - logs/application.log

# ========================================
# Monitoring (Redis/DB 설정 상속)
# ========================================
monitoring:
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    db: ${REDIS_DB}
  metrics:
    enabled: true
    interval_sec: 60

# ========================================
# Database (상속)
# ========================================
database:
  url: ${DATABASE_URL}
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}

# ========================================
# Telegram (상속)
# ========================================
telegram:
  token: ${TELEGRAM_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  enabled: ${ENABLE_TELEGRAM}

# ========================================
# 전략별 파라미터 (초기 기준선)
# ========================================
strategies:
  scalping_v3:
    rsi_oversold: 30
    rsi_overbought: 70
    bb_std: 2.0
    volume_spike_threshold: 1.5
  
  volatility_breakout_v2:
    atr_period: 14
    bb_period: 20
    bb_std: 2.5
    volume_multiplier: 1.5
  
  mean_reversion_v2:
    bb_period: 20
    bb_std: 2.0
    rsi_period: 14
    rsi_oversold: 25
    rsi_overbought: 75
  
  trend_follow_v2:
    fast_ema: 12
    slow_ema: 26
    signal_period: 9
    adx_period: 14
    adx_threshold: 25
  
  volume_based_v2:
    volume_period: 20
    volume_spike_threshold: 2.0
    obv_period: 14
