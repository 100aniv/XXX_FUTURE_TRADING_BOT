# ========================================
# PHASE20-2: Ensemble Extended Paper Test Config
# 목표: 24시간 wall-clock Paper 테스트로 멀티 심볼 Ensemble 안정성 검증
# ========================================

# ========================================
# 실행 모드 & 환경
# ========================================
mode: paper
env: paper
run_id: "PHASE20-2_ensemble_24h_multi"

# ========================================
# 심볼 & Timeframe (멀티 심볼)
# ========================================
symbol: BTCUSDT
timeframe: 5m

# 추가 심볼 (멀티 심볼 지원 시)
# symbols:
#   - BTCUSDT
#   - ETHUSDT

# ========================================
# Ensemble 설정 (ON)
# ========================================
ensemble:
  enabled: true  # ⭐ Ensemble 모드 활성화
  strategies:    # 7개 전략 전부 사용
    - scalping
    - breakout
    - reversion
    - trend
    - swing
    - swing_bb
    - daytrade
  min_tier1_score: 0.8        # Tier 1 최소 점수 (High-Confidence)
  min_tier2_score: 0.5        # Tier 2 최소 점수 (Consensus)
  tier1_conflict_diff: 0.15   # Tier 1 충돌 시 최소 점수 차이
  min_tier2_votes: 2          # Tier 2 최소 투표 수

# ========================================
# Strategy Selector (Ensemble 식별용)
# ========================================
strategy:
  selector: ensemble  # 엔진에서 Ensemble 모드 식별

# ========================================
# Paper Trading 설정 (24h wall-clock)
# ========================================
paper:
  duration_mode: "wall_clock"  # ⭐ 실제 시계 기준 24시간
  duration_hours: 24           # 24시간 실행
  clean_start: true            # 깨끗한 시작 (기존 포지션 무시)

# ========================================
# Portfolio 설정 (PHASE17 Production 기준 유지)
# ========================================
portfolio:
  initial_balance: 10000.0
  currency: USDT
  max_open_positions: 3
  max_exposure_pct: 0.9  # 90%

# ========================================
# Position Sizing (PHASE17 Production 기준 유지)
# ========================================
position_sizing:
  default_risk_per_trade: 0.02  # 2% RPT
  mode: kelly_fraction
  kelly_fraction: 0.25
  leverage: 3.0
  max_leverage: 5.0

# ========================================
# Risk Manager (PHASE17 Production 기준 유지)
# ========================================
risk:
  max_daily_loss_pct: 0.10      # 10% 일일 손실 한도
  max_consecutive_losses: 10
  cooldown_after_consecutive: 60
  max_portfolio_dd_pct: 0.15    # 15% 포트폴리오 DD 한도
  max_slippage_pct: 0.5
  extreme_loss_cutoff_pct: -20.0
  profiles:
    paper:
      max_daily_loss_pct: 0.20        # Paper 모드는 완화
      max_consecutive_losses: 15
      cooldown_after_consecutive: 30

# ========================================
# Exits (PHASE17 Production 기준 유지)
# ========================================
exits:
  default_tp_levels:
    - 0.02  # +2%
    - 0.04  # +4%
  default_sl_pct: 0.015  # -1.5%
  trailing_enabled: true
  trailing_activation_pct: 0.01
  trailing_callback_pct: 0.005

# ========================================
# FlowGuardian (Production 기준 유지)
# ========================================
flow_guardian:
  enabled: true
  selftest:
    max_runtime_sec: 120
    require_metrics:
      - profit_factor
      - winrate
      - score_total
      - exp_score
    min_profit_factor: 0.0
    min_winrate: 0.0
    consistency_checks:
      db_vs_json_score_equal: true
      signals_no_nan: true
      risk_never_oversize: true
    snapshot_rules:
      require_segment_isolation: true
    artifacts:
      require_files:
        - logs/trial_0000.json
        - logs/application.log

# ========================================
# Monitoring (Redis/DB 설정 상속)
# ========================================
monitoring:
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    db: ${REDIS_DB}
  metrics:
    enabled: true
    interval_sec: 60

# ========================================
# Database (상속)
# ========================================
database:
  url: ${DATABASE_URL}
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}

# ========================================
# Telegram (상속)
# ========================================
telegram:
  token: ${TELEGRAM_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  enabled: ${ENABLE_TELEGRAM}
