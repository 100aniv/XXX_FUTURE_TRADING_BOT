# PHASE21-1: Single Strategy Paper Test - TREND
# Purpose: Isolate trend strategy performance (Ensemble OFF)
# Runtime: 12 hours wall-clock
# Symbol: BTCUSDT
# Timeframe: 5m

mode: paper
duration_mode: wall_clock
duration_hours: 1

symbols:
  - BTCUSDT

timeframe: 5m

# === ENSEMBLE OFF (Single Strategy Mode) ===
ensemble:
  enabled: false

# === Single Strategy: Trend ===
strategy:
  use_ensemble: false
  selected: trend
  trend:
    enabled: true
    params:
      ma_fast_period: 10
      ma_slow_period: 30
      trend_strength_threshold: 0.6
      max_position_size: 0.1
      stop_loss_pct: 2.5
      take_profit_pct: 2.0

# === Risk & Portfolio ===
portfolio:
  initial_balance: 50000
  max_position_value: 5000
  max_open_positions: 5

risk:
  max_drawdown_pct: 30.0
  extreme_loss_threshold: -1000
  position_size_mode: kelly_fraction

# === Monitoring ===
monitoring:
  log_level: INFO
  log_to_file: true
  metrics_interval_seconds: 60

# === Feed & Broker ===
feed:
  type: binance_websocket
  symbols:
    - BTCUSDT
  timeframes:
    - 5m

broker:
  type: paper
  slippage_pct: 0.05
  commission_pct: 0.1
