# ========================================
# PHASE27-2: Strategy Redesign - Single-Symbol 30m Baseline
# 목표: Signal Dropout 해소, 신규 베이스라인 전략 검증
# ========================================

# ========================================
# 실행 모드 & 환경
# ========================================
mode: paper
env: paper
run_id: "phase27_2_single_symbol_30m_baseline"

# ========================================
# 심볼 & Timeframe
# ========================================
symbol: BTCUSDT
timeframe: 5m
lookback: 1000

# ========================================
# Ensemble 설정 (Baseline 전략만 사용)
# ========================================
ensemble:
  enabled: true
  mode: score_v2
  
  # 베이스라인 전략만 활성화
  strategies:
    - btc5m_baseline_v1
  
  # 전략별 가중치
  strategy_weights:
    btc5m_baseline_v1: 1.0
  
  # 3-Tier Decision Thresholds (단일 전략이므로 완화)
  high_conf_threshold: 0.4
  consensus_threshold: 0.2
  min_strategies: 1  # 단일 전략
  max_strategy_weight: 1.0  # 단일 전략이므로 100% 허용
  
  # Risk/Quality Filters (신호 통과 우선)
  max_risk: 0.95
  min_quality: 0.1

# ========================================
# Strategy Selector (Ensemble 식별용)
# ========================================
strategy:
  selector: ensemble

# ========================================
# Paper Trading 설정
# ========================================
paper:
  duration_mode: "wall_clock"
  duration_minutes: 10  # 10분 실행 (빠른 검증)
  clean_start: true

# ========================================
# Capital
# ========================================
capital:
  initial: 50000

# ========================================
# Execution
# ========================================
execution:
  order_type: MARKET
  timeout_sec: 30
  reject_cooldown_seconds: 60

# ========================================
# Equity
# ========================================
equity: 50000

# ========================================
# Portfolio 설정
# ========================================
portfolio:
  initial_balance: 50000.0
  currency: USDT
  max_open_positions: 3
  max_symbol_exposure_pct: 30
  max_exposure_pct: 60
  max_total_exposure: 0.6
  max_strategy_positions: 2
  use_dynamic_exposure: true
  use_dynamic_budget: true
  symbol_cooldown_seconds: 60

# ========================================
# Position Sizing
# ========================================
position_sizing:
  default_risk_per_trade: 0.02
  mode: kelly_fraction
  kelly_fraction: 0.25
  leverage: 3.0
  max_leverage: 5.0
  quality_weight_min: 0.7
  quality_weight_max: 1.3
  max_position_value: 25000
  min_position_value: 100
  context_scaling:
    enabled: true
    atr_low_pct: 0.004
    atr_high_pct: 0.02
    low_vol_mult: 1.2
    high_vol_mult: 0.7
    neutral_mult: 1.0

# ========================================
# Risk Manager
# ========================================
risk:
  per_trade: 0.02
  max_positions: 3
  max_exposure_per_symbol: 0.3
  max_daily_loss_pct: 0.10
  max_consecutive_losses: 10
  cooldown_after_consecutive: 60
  max_portfolio_dd_pct: 0.15
  max_drawdown_pct: 10.0
  max_slippage_pct: 0.5
  extreme_loss_cutoff_pct: -20.0
  profiles:
    paper:
      max_daily_loss_pct: 0.20
      max_consecutive_losses: 15
      cooldown_after_consecutive: 30

# ========================================
# Exits
# ========================================
exits:
  default_tp_levels:
    - 0.02
    - 0.04
  default_sl_pct: 0.015
  trailing_enabled: true
  trailing_activation_pct: 0.01
  trailing_callback_pct: 0.005

# ========================================
# FlowGuardian
# ========================================
flow_guardian:
  enabled: true
  selftest:
    max_runtime_sec: 120
    require_metrics:
      - profit_factor
      - winrate
      - score_total
      - exp_score
    min_profit_factor: 0.0
    min_winrate: 0.0
    consistency_checks:
      db_vs_json_score_equal: true
      signals_no_nan: true
      risk_never_oversize: true
    snapshot_rules:
      require_segment_isolation: true
    artifacts:
      require_files:
        - logs/trial_0000.json
        - logs/application.log

# ========================================
# TradeActivityTracker (PHASE27-0 진단 도구)
# ========================================
trade_activity_tracker:
  enabled: true
  log_interval: 60  # 60초마다 로그
  summary_file: "docs/PHASE27/phase27_2_single_symbol_30m_baseline_summary.json"

# ========================================
# Monitoring
# ========================================
monitoring:
  redis:
    host: localhost
    port: 6379
    db: 0
  metrics:
    enabled: true
    interval_sec: 60

# ========================================
# Database
# ========================================
database:
  url: ${DATABASE_URL}
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}

# ========================================
# Telegram
# ========================================
telegram:
  token: ${TELEGRAM_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  enabled: ${ENABLE_TELEGRAM}

# ========================================
# 전략별 파라미터 - BTC 5m Baseline V1
# ========================================
strategies:
  btc5m_baseline_v1:
    # 신호 조건 (데이터 프로파일링 기반)
    rsi_long_threshold: 45    # RSI p25 근처
    rsi_short_threshold: 55   # RSI p75 근처
    bb_std_main: 1.0          # 주요 BB 밴드
    bb_std_strong: 1.5        # 강한 신호 BB 밴드
    momentum_lookback: 5      # 모멘텀 확인 캔들 수
    momentum_threshold: 0.001 # 0.1% 모멘텀 기준
    
    # 위험 관리
    rr: 1.5                   # Risk/Reward
    atr_mult_sl: 1.5          # SL = ATR × 1.5
    max_hold_minutes: 60      # 최대 보유 시간
    min_bars_for_signal: 50   # 최소 데이터
    
    # Filters
    filters:
      allow_short: true
    
    # Leverage
    leverage:
      min: 1
      max: 5
      default: 3
