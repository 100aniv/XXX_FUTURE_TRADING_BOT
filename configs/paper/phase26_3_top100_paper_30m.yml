# ========================================
# PHASE26-3: Top100 Multi-Symbol PAPER Performance Test Config
# 목표: Top100 심볼 성능 최적화 검증용 30분 PAPER 실행
# ========================================

# ========================================
# Universe Provider 설정 (PHASE26-3: Top100)
# ========================================
universe:
  enabled: true  # ⭐ Universe 모드 활성화
  
  provider:
    type: topn_volume  # 'static' | 'topn_volume'
    top_n: 100          # ⭐ Top100 심볼 선정 (PHASE26-3)
    cache_ttl_sec: 3600  # 1시간 캐시 (프로세스 시작 시 1회만)
  
  filters:
    quote_assets:
      - USDT               # USDT 쌍만
    exclude_symbols:
      - BTCDOWNUSDT
      - BTCUPUSDT
      - ETHDOWNUSDT
      - ETHUPUSDT          # 레버리지 토큰 제외
    min_24h_volume_usd: 5000000  # ⭐ 5M USDT (Top100 확보용, 기존 10M→5M)
    market_types:
      - PERPETUAL          # 선물 마켓만
    contract_status: TRADING  # TRADING 상태만

# ========================================
# 실행 모드 & 환경
# ========================================
mode: paper
env: paper
run_id: "PHASE26-3_top100_paper_30m"

# ⭐ symbol 키는 fallback용으로 유지 (universe 실패 시)
symbol: BTCUSDT

timeframe: 5m
lookback: 1000

# ========================================
# Paper Trading 설정 (PHASE26-3: 30분 Acceptance)
# ========================================
paper:
  duration_mode: "wall_clock"  # 실제 시계 기준
  duration_hours: 0.5           # ⭐ 30분 실행 (Acceptance 테스트용, 기존 2H→30분)
  clean_start: true             # 깨끗한 시작 (기존 포지션 무시)

# ========================================
# Portfolio 설정 (Top100용 더욱 보수적)
# ========================================
portfolio:
  initial_balance: 10000.0
  currency: USDT
  max_open_positions: 20       # ⭐ Top100 × 1포지션/5심볼 가정 (기존 10→20)
  max_exposure_pct: 0.3         # ⭐ 30% (Top100 안전 마진, 기존 50%→30%)
  max_strategy_positions: 10    # 전략당 최대 포지션

# ========================================
# Position Sizing (Top100용 더욱 축소)
# ========================================
position_sizing:
  default_risk_per_trade: 0.001  # ⭐ 0.1% RPT (기존 0.2%→0.1%, Top100 안전)
  mode: kelly_fraction
  kelly_fraction: 0.25
  leverage: 3.0
  max_leverage: 5.0

# ========================================
# Risk Manager (Top100용 강화)
# ========================================
risk:
  max_daily_loss_pct: 0.10      # 10% 일일 손실 한도
  max_consecutive_losses: 10
  cooldown_after_consecutive: 60
  max_portfolio_dd_pct: 0.15    # 15% 포트폴리오 DD 한도
  max_slippage_pct: 0.5
  extreme_loss_cutoff_pct: -20.0
  
  # ⭐ Top100 전용 리스크 파라미터
  per_trade: 0.001                # 0.1% RPT (명시적)
  max_positions: 20                # Top100 × 1포지션/5심볼
  max_exposure_per_symbol: 0.05    # ⭐ 심볼당 5% 한도 (기존 10%→5%)
  max_exposure_pct: 0.3           # ⭐ 전체 30% 한도 (기존 50%→30%)
  
  profiles:
    paper:
      max_daily_loss_pct: 0.20        # Paper 모드는 완화
      max_consecutive_losses: 15
      cooldown_after_consecutive: 30

# ========================================
# Exits (PHASE17 Production 기준 유지)
# ========================================
exits:
  default_tp_levels:
    - 0.02  # +2%
    - 0.04  # +4%
  default_sl_pct: 0.015  # -1.5%
  trailing_enabled: true
  trailing_activation_pct: 0.01
  trailing_callback_pct: 0.005

# ========================================
# Strategy Selector (단일 전략)
# ========================================
strategy:
  selector: scalping  # 단일 전략 (Multi-Symbol Top100 테스트)

# ========================================
# Scalping 전략 설정
# ========================================
strategies:
  scalping:
    enabled: true
    timeframe: 5m
    risk_per_trade: 0.001  # 0.1% RPT

# ========================================
# FlowGuardian (Production 기준 유지)
# ========================================
flow_guardian:
  enabled: true
  selftest:
    max_runtime_sec: 120
    require_metrics:
      - profit_factor
      - winrate
      - score_total
      - exp_score
    min_profit_factor: 0.0
    min_winrate: 0.0
    consistency_checks:
      db_vs_json_score_equal: true
      signals_no_nan: true
      risk_never_oversize: true
    snapshot_rules:
      require_segment_isolation: true
    artifacts:
      require_files:
        - logs/trial_0000.json
        - logs/application.log

# ========================================
# Monitoring (Redis/DB 설정 상속)
# ========================================
monitoring:
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    db: ${REDIS_DB}
  metrics:
    enabled: true
    interval_sec: 60

# ========================================
# Database (상속)
# ========================================
database:
  url: ${DATABASE_URL}
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}

# ========================================
# Telegram (상속)
# ========================================
telegram:
  token: ${TELEGRAM_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  enabled: ${ENABLE_TELEGRAM}

# ========================================
# Logging (상속)
# ========================================
logging:
  level: INFO  # ⭐ INFO 유지 (TRACE/DEBUG는 성능 테스트 시 비활성화)
  format: detailed
  file: logs/application.log

# ========================================
# Symbols (Legacy fallback)
# ========================================
symbols:
  - BTCUSDT

# ========================================
# Feed 설정 (PAPER 모드, WebSocket)
# ========================================
feed:
  type: websocket
  exchange: bybit
  testnet: false

# ========================================
# PHASE26-3 Performance Profiling 설정
# ========================================
performance:
  profiling_enabled: false  # 기본 비활성화 (Runner에서 명시적 활성화)
  profiler_output: "docs/PHASE26/phase26_3_top100_profile.json"
  
  # Indicator Cache (기본 비활성화, Runner에서 활성화)
  indicator_cache_enabled: false
