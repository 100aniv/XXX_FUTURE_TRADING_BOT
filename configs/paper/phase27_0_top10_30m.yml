# ========================================
# PHASE27-0: Trade Activity Diagnosis - Multi-Symbol Top10 30m
# 목표: Drop-off instrumentation 검증 (PHASE26-2 기반)
# ========================================

# ========================================
# Universe Provider 설정 (PHASE26-2)
# ========================================
universe:
  enabled: true  # ⭐ Universe 모드 활성화
  
  provider:
    type: topn_volume  # 'static' | 'topn_volume'
    top_n: 10           # Top10 심볼 선정
    cache_ttl_sec: 3600  # 1시간 캐시 (프로세스 시작 시 1회만)
  
  filters:
    quote_assets:
      - USDT               # USDT 쌍만
    exclude_symbols:
      - BTCDOWNUSDT
      - BTCUPUSDT
      - ETHDOWNUSDT
      - ETHUPUSDT          # 레버리지 토큰 제외
    min_24h_volume_usd: 10000000  # 최소 24H 거래량 (10M USDT)
    market_types:
      - PERPETUAL          # 선물 마켓만 (or [SPOT])
    contract_status: TRADING  # TRADING 상태만

# ========================================
# 실행 모드 & 환경
# ========================================
mode: paper
env: paper
run_id: "phase27_0_top10_30m"

# ⭐ symbol 키는 fallback용으로 유지 (universe 실패 시)
symbol: BTCUSDT

timeframe: 5m
lookback: 1000

# ========================================
# Paper Trading 설정
# ========================================
paper:
  duration_mode: "wall_clock"  # 실제 시계 기준
  duration_hours: 0.5           # ⭐ 30분 실행 (PHASE27-0 Diagnosis용)
  clean_start: true             # 깨끗한 시작 (기존 포지션 무시)

# ========================================
# Portfolio 설정 (Multi-Symbol용 보수적 설정)
# ========================================
portfolio:
  initial_balance: 10000.0
  currency: USDT
  max_open_positions: 10       # Top10 × 1포지션/심볼 가정
  max_exposure_pct: 0.5         # ⭐ 50% (Multi-Symbol 안전 마진)
  max_strategy_positions: 5     # 전략당 최대 포지션 (보수적)

# ========================================
# Position Sizing (Multi-Symbol용 축소)
# ========================================
position_sizing:
  default_risk_per_trade: 0.002  # ⭐ 0.2% RPT (Multi-Symbol 안전)
  mode: kelly_fraction
  kelly_fraction: 0.25
  leverage: 3.0
  max_leverage: 5.0

# ========================================
# Risk Manager (Multi-Symbol용 강화)
# ========================================
risk:
  max_daily_loss_pct: 0.10      # 10% 일일 손실 한도
  max_consecutive_losses: 10
  cooldown_after_consecutive: 60
  max_portfolio_dd_pct: 0.15    # 15% 포트폴리오 DD 한도
  max_slippage_pct: 0.5
  extreme_loss_cutoff_pct: -20.0
  
  # ⭐ Multi-Symbol 전용 리스크 파라미터
  per_trade: 0.002                # 0.2% RPT (명시적)
  max_positions: 10                # Top10 × 1포지션/심볼
  max_exposure_per_symbol: 0.1    # 심볼당 10% 한도
  max_exposure_pct: 0.5           # 전체 50% 한도
  
  profiles:
    paper:
      max_daily_loss_pct: 0.20
      max_consecutive_losses: 15
      cooldown_after_consecutive: 30

# ========================================
# Exits (Multi-Symbol용)
# ========================================
exits:
  default_tp_levels:
    - 0.02  # +2%
    - 0.04  # +4%
  default_sl_pct: 0.015  # -1.5%
  trailing_enabled: true
  trailing_activation_pct: 0.01
  trailing_callback_pct: 0.005

# ========================================
# Ensemble 설정 (Score V2 모드)
# ========================================
ensemble:
  enabled: true  # ⭐ Ensemble 모드 활성화
  mode: score_v2  # ⭐ Score V2 엔진 사용
  
  # 5개 V2 전략
  strategies:
    - scalping_v3
    - volatility_breakout_v2
    - mean_reversion_v2
    - trend_follow_v2
    - volume_based_v2
  
  # 전략별 가중치
  strategy_weights:
    scalping_v3: 1.0
    volatility_breakout_v2: 1.0
    mean_reversion_v2: 1.0
    trend_follow_v2: 1.0
    volume_based_v2: 1.0
  
  # 3-Tier Decision Thresholds
  high_conf_threshold: 0.7
  consensus_threshold: 0.4
  min_strategies: 2
  
  # Dominance Prevention
  max_strategy_weight: 0.6
  
  # Risk/Quality Filters
  max_risk: 0.8
  min_quality: 0.3

# ========================================
# Strategy Selector
# ========================================
strategy:
  selector: ensemble

# ========================================
# FlowGuardian
# ========================================
flow_guardian:
  enabled: true
  selftest:
    max_runtime_sec: 120
    require_metrics:
      - profit_factor
      - winrate
      - score_total
      - exp_score
    min_profit_factor: 0.0
    min_winrate: 0.0
    consistency_checks:
      db_vs_json_score_equal: true
      signals_no_nan: true
      risk_never_oversize: true
    snapshot_rules:
      require_segment_isolation: true
    artifacts:
      require_files:
        - logs/trial_0000.json
        - logs/application.log

# ========================================
# Monitoring
# ========================================
monitoring:
  redis:
    host: localhost
    port: 6379
    db: 0
  metrics:
    enabled: true
    interval_sec: 60

# ========================================
# Database
# ========================================
database:
  url: ${DATABASE_URL}
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  password: ${DB_PASSWORD}

# ========================================
# Telegram
# ========================================
telegram:
  token: ${TELEGRAM_TOKEN}
  chat_id: ${TELEGRAM_CHAT_ID}
  enabled: ${ENABLE_TELEGRAM}

# ========================================
# 전략별 파라미터
# ========================================
strategies:
  scalping_v3:
    rsi_oversold: 30
    rsi_overbought: 70
    bb_std: 2.0
    volume_spike_threshold: 1.5
  
  volatility_breakout_v2:
    atr_period: 14
    bb_period: 20
    bb_std: 2.5
    volume_multiplier: 1.5
  
  mean_reversion_v2:
    bb_period: 20
    bb_std: 2.0
    rsi_period: 14
    rsi_oversold: 25
    rsi_overbought: 75
  
  trend_follow_v2:
    fast_ema: 12
    slow_ema: 26
    signal_period: 9
    adx_period: 14
    adx_threshold: 25
  
  volume_based_v2:
    volume_period: 20
    volume_spike_threshold: 2.0
    obv_period: 14
